<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-Ou9ul81P9RnC/R4KBbN5JI+xaGfmFjgPyr3BiAWpemg='; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>記帳月報</title>
<style>
/* ══ 記帳月報：月報檔（money-report/1）的檢視器。所有資料只存在這台裝置的瀏覽器（IndexedDB）。
   視覺跟工具箱同一套中性色；圖表色依類別代碼固定（dataviz 參考配色，淺／深色都經驗證工具驗過）。 ══ */
:root{
  --bg: oklch(96.2% 0.004 250); --card: oklch(99.2% 0.002 250);
  --ink: oklch(22% 0.012 255); --ink-2: oklch(42% 0.012 255); --ink-3: oklch(52% 0.01 255);
  --rule: oklch(90% 0.008 250); --grid: #e1e0d9; --axis: #c3c2b7;
  --accent: oklch(47% 0.13 250); --accent-soft: oklch(94% 0.03 250);
  --tip: oklch(22% 0.012 255); --tip-ink: oklch(97% 0.004 250);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s0:#797771;
  --fF:#86b6ef; --fB:#3987e5; --fD:#184f95;
  --hatch: #8e9298;   /* 沒記帳斜線：對卡片 3.05:1 */
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --danger: oklch(50% 0.17 25); --danger-line: oklch(80% 0.06 25);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg: oklch(18.5% 0.008 255); --card: oklch(22.5% 0.01 255);
  --ink: oklch(93% 0.005 250); --ink-2: oklch(80% 0.008 250); --ink-3: oklch(68% 0.008 250);
  --rule: oklch(32% 0.01 255); --grid: #2c2c2a; --axis: #383835;
  --accent: oklch(74% 0.11 250); --accent-soft: oklch(30% 0.045 250);
  --tip: oklch(93% 0.005 250); --tip-ink: oklch(18.5% 0.008 255);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s0:#aaa8a1;
  --fF:#184f95; --fB:#3987e5; --fD:#9ec5f4; --hatch: #6b6f75; --danger: oklch(72% 0.15 25); --danger-line: oklch(45% 0.1 25); color-scheme: dark } }
:root[data-theme="dark"]{
  --bg: oklch(18.5% 0.008 255); --card: oklch(22.5% 0.01 255);
  --ink: oklch(93% 0.005 250); --ink-2: oklch(80% 0.008 250); --ink-3: oklch(68% 0.008 250);
  --rule: oklch(32% 0.01 255); --grid: #2c2c2a; --axis: #383835;
  --accent: oklch(74% 0.11 250); --accent-soft: oklch(30% 0.045 250);
  --tip: oklch(93% 0.005 250); --tip-ink: oklch(18.5% 0.008 255);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s0:#aaa8a1;
  --fF:#184f95; --fB:#3987e5; --fD:#9ec5f4; --hatch: #6b6f75; --danger: oklch(72% 0.15 25); --danger-line: oklch(45% 0.1 25); color-scheme: dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:clamp(16px,3vw,28px);padding-block:20px calc(48px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}
.k{font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}

/* 頁首 */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;margin-bottom:16px}
.top h1{margin:0;font:700 24px/1.25 var(--sans);letter-spacing:.01em}
.top p{margin:4px 0 0;font-size:13px;color:var(--ink-3)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid var(--rule);
     background:var(--card);cursor:pointer;font-size:14px;font-weight:500;transition:border-color .15s}
.btn:hover{border-color:var(--accent)}
a.btn{color:inherit;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger-line)}
.alert{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 12px;padding:12px 14px;border-radius:10px;margin-bottom:12px;
       border:1px solid var(--danger-line);background:var(--card);font-size:14px}
.alert ul{margin:4px 0 0;padding-left:1.2em}
.warn{color:var(--danger);font-weight:500}
.months{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 8px;scrollbar-width:thin}
.months button{flex:none;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--card);cursor:pointer;font-size:14px}
.months button[aria-current]{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:700}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 14px;border-radius:10px;
        background:var(--accent-soft);color:var(--ink);font-size:14px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;max-width:min(92vw,520px);
       padding:10px 16px;border-radius:10px;background:var(--tip);color:var(--tip-ink);font-size:14px;box-shadow:0 6px 24px rgb(0 0 0 / .18)}

/* 卡片與區塊 */
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:18px clamp(14px,2.4vw,22px);min-width:0}
.grid{display:grid;gap:12px}
section{margin-top:12px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-bottom:12px}
.sec-h h2{margin:0;font:700 17px/1.35 var(--sans)}
.sec-h .k{text-transform:none;letter-spacing:.02em}
.honest{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;
     background:oklch(93% 0.06 85);color:oklch(38% 0.08 70)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag{background:oklch(34% 0.06 80);color:oklch(90% 0.08 85)} }
:root[data-theme="dark"] .tag{background:oklch(34% 0.06 80);color:oklch(90% 0.08 85)}

/* 主要數字 */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:2px}
.tile .v{font:700 26px/1.2 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.tile .sub{font-size:13px;color:var(--ink-3)}
@media (max-width:820px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:380px){ .tile .v{font-size:22px} }

/* 分析 */
.an-head{margin:0 0 14px;font:700 19px/1.5 var(--sans);text-wrap:balance}
.an-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}
.an-cols h3{margin:0 0 6px;font-size:14px;color:var(--ink-2)}
.an-cols ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.an-foot{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);font-size:14px}
.an-foot b{font-weight:700}
.empty-an{color:var(--ink-3);font-size:14px;margin:0}
@media (max-width:720px){ .an-cols{grid-template-columns:1fr} }

/* 分布：堆疊總覽條＋排序列 */
.stack{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;margin-bottom:16px;background:var(--card)}
.stack i{display:block;min-width:6px}   /* 太窄的末段會被 7px 圓角切成月牙，看起來像條的邊框 */
/* 同一張卡裡的列共用一組欄線（subgrid）：名稱欄寬由最長的名稱決定，長條一律從同一條線開始 */
.rows{display:grid;grid-template-columns:max-content minmax(0,1fr) max-content;column-gap:12px;row-gap:2px}
.row{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:center;padding:7px 6px;border-radius:8px;
     width:100%;text-align:left;border:0;background:transparent;cursor:pointer}
.row:hover{background:var(--accent-soft)}
.row .nm{display:flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap;min-width:0;max-width:12em}
.nm .t{overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .nm .sw{width:10px;height:10px;border-radius:3px;flex:none}
.row .nm .chev{font-size:11px;color:var(--ink-3);transition:transform .15s}
.row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.bar{height:10px;border-radius:0 4px 4px 0;min-width:0}
.track{background:transparent;min-width:0}
.row .amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.row .amt small{display:block;font-size:12px;color:var(--ink-3);white-space:normal;max-width:17em;margin-left:auto;text-wrap:pretty}
@media (max-width:480px){ .row .amt small{max-width:9.5em} }   /* 比較說明換行，不把長條擠掉 */
.subrows{grid-column:1/-1;display:grid;grid-template-columns:subgrid;padding:2px 0 6px}
/* 細項兩行：名稱在第一行、橫跨名稱欄＋長條欄，長條在第二行。跨到彈性欄（1fr）的項目不參與名稱欄的寬度計算，
   所以展開細項不會撐寬名稱欄、讓其他列的長條一起縮短（舊版手機上「住」的長條會從 125px 縮到 49px）；名稱也不必截斷 */
.subrow{grid-column:1/-1;display:grid;grid-template-columns:subgrid;grid-template-rows:auto auto;row-gap:2px;align-items:center;padding:4px 6px 4px 30px;font-size:13px;color:var(--ink-2)}
.subrow > span:first-child{grid-column:1/3;grid-row:1;min-width:0;overflow-wrap:anywhere}
.subrow .track{grid-column:2;grid-row:2}
.subrow .bar{height:6px}
.subrow .amt{grid-column:3;grid-row:1/3;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.subrow .amt small{display:block;font-size:12px;color:var(--ink-3)}   /* 金額和筆數分兩行，免得「NT$1,200」「1 筆」黏成 NT$1,2001 筆 */
.flexnote{font-size:12px;color:var(--ink-3);font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:820px){ .two{grid-template-columns:1fr} }
@media (max-width:480px){ .rows{column-gap:8px} .row .nm{max-width:9em}
  .row .nm .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical} }

/* 彈性度 */
.flexbar{display:flex;gap:2px;height:28px;border-radius:6px;overflow:hidden}
.flexbar i{display:block;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:10px;height:10px;border-radius:3px}
.flex-desc{margin:10px 0 0;font-size:13px;color:var(--ink-3)}

/* 圖表 */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:500 11px var(--mono);fill:var(--ink-3)}
.tip{position:fixed;z-index:30;pointer-events:none;padding:8px 10px;border-radius:8px;background:var(--tip);color:var(--tip-ink);
     font-size:13px;line-height:1.45;box-shadow:0 6px 24px rgb(0 0 0 / .2);max-width:240px}
.tip b{display:block;font-weight:700}
details.tbl{margin-top:12px;font-size:13px}
details.tbl summary{cursor:pointer;color:var(--ink-2);padding:4px 0}
.tblwrap{overflow-x:auto;margin-top:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}
td.r,th.r{text-align:right}

/* 空狀態與匯入 */
.empty{display:grid;place-items:center;text-align:center;padding:48px 20px}
.empty h2{margin:0 0 8px;font-size:20px}
.empty p{margin:0 auto 18px;max-width:30em;color:var(--ink-2);font-size:14px}
.drop{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:color-mix(in oklab,var(--bg) 82%,transparent);
      border:3px dashed var(--accent);font:700 20px var(--sans);color:var(--accent)}
.manage ul{list-style:none;margin:0;padding:0}
.manage li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--rule)}
.manage .meta{font-size:12px;color:var(--ink-3)}
.privacy{margin-top:18px;font-size:12px;color:var(--ink-3);line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>記帳月報</h1><p>每月的花費分布與建議。資料只存在這台裝置的瀏覽器。</p></div>

  <div class="alert" id="alert" role="alert" hidden></div>

  <section class="card manage" id="manage" hidden aria-labelledby="mg-h">
    <div class="sec-h"><h2 id="mg-h">這台裝置上的月報</h2><span class="k">存在瀏覽器（IndexedDB），不會上傳</span></div>
    <ul id="mgList"></ul>
    <div class="acts" style="margin-top:12px"><button class="btn danger" type="button" id="wipeBtn">刪除全部月報</button></div>

  <nav class="months" id="months" aria-label="月份"></nav>
  <main id="main"></main>
  <p class="privacy">這個網頁不會把任何資料傳出去：它的安全設定不允許連線到任何伺服器（連字型都用裝置內建的）。月報只存在你現在用的這台裝置的瀏覽器裡；同一個網站（ericlau1107.github.io）上的其他工具頁在技術上也讀得到，所以那些頁面一律不放廣告或追蹤程式。換手機或清除瀏覽器資料就要重新匯入。</p>
</div>

  if (r.daily.some(d => d.fixed !== undefined) && sum(r.daily.map(d => d.fixed || 0)) !== r.by_flex.F) return '每日固定支出加總 ≠ 固定支出';
  const a = r.analysis;
  if (a !== null) {
    if (!a || typeof a !== 'object' || !isStr(a.headline) || !a.headline.trim()) return 'analysis.headline 錯誤';
    for (const k of ['findings', 'advice']) if (a[k] !== undefined && (!arr(a[k], 8) || a[k].some(x => !isStr(x)))) return `analysis.${k} 錯誤`;
    for (const k of ['commitment', 'question']) if (a[k] != null && !isStr(a[k])) return `analysis.${k} 錯誤`;
  }
  return null;
}

/* ══ 儲存：IndexedDB；不能用（私密瀏覽、被封鎖）就退回記憶體並明說 ══ */
const DB = {
  db: null, mem: new Map(), ok: false,
  async open(){
    try {
      this.db = await new Promise((res, rej) => {
        const q = indexedDB.open('money-report', 1);
        q.onupgradeneeded = () => q.result.createObjectStore('months', {keyPath: 'month'});
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      });
      this.ok = true;
    } catch (e) { this.ok = false; }
  },
  tx(mode){ return this.db.transaction('months', mode).objectStore('months'); },
  req(r){ return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async all(){ return this.ok ? this.req(this.tx('readonly').getAll()) : [...this.mem.values()]; },
  async put(rep){ if (this.ok) await this.req(this.tx('readwrite').put(rep)); else this.mem.set(rep.month, rep); },
  async del(m){ if (this.ok) await this.req(this.tx('readwrite').delete(m)); else this.mem.delete(m); },
  async clear(){ if (this.ok) await this.req(this.tx('readwrite').clear()); else this.mem.clear(); }
};

/* ══ 狀態 ══ */
let reports = [];         // 目前顯示的月報（樣本模式時是樣本）
let stored = [];          // 存在裝置上的月報
let sampleMode = false, cur = null;
const byMonth = m => reports.find(r => r.month === m);

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 4200);
}

let skipped = [];          // 存在裝置上、但不符合目前格式的月報（例如網頁改版後驗證變嚴）：不顯示，但要明說
async function load(){
  const all = await DB.all();
  skipped = all.map(r => [r, validate(r)]).filter(([, err]) => err).map(([r, err]) => `${typeof r.month === 'string' ? r.month.slice(0, 7) : '不明月份'}：${err}`);
  stored = all.filter(r => !validate(r)).sort((a, b) => a.month.localeCompare(b.month));
  if (!sampleMode) reports = stored;
}

/* ══ 匯入 ══ */
async function importFiles(files){
  const done = [], bad = [];
  for (const f of files) {
    if (f.size > 2e6) { bad.push(`${f.name}：檔案太大（月報檔通常只有幾十 KB）`); continue; }
    let rep;
    try { rep = JSON.parse(await f.text()); } catch (e) { bad.push(`${f.name}：不是 JSON 檔`); continue; }
    const err = validate(rep);
    if (err) { bad.push(`${f.name}：${err}`); continue; }
    const old = stored.find(r => r.month === rep.month);
    try { await DB.put(rep); } catch (e) { bad.push(`${f.name}：無法存進這台裝置（${e && e.name || '儲存失敗'}）`); continue; }
    done.push(monthLabel(rep.month) + (old ? '（取代舊版）' : ''));
  }
  if (sampleMode && done.length) leaveSample(false);
  await load();
  if (done.length) cur = reports.length ? reports[reports.length - 1].month : null;
  render();
  showErrors(bad);
  if (done.length) toast(`已匯入 ${done.join('、')}` + (!DB.ok ? '。這台裝置不能長期儲存，關掉頁面就會消失' : ''));
}
/* 失敗原因放在頁面上、不自動消失：方便照著改或轉告 Claude */
function showErrors(list, title = `有 ${list.length} 個檔案無法匯入`){
  const box = $('alert'); box.replaceChildren();
  box.hidden = !list.length;
  if (!list.length) return;
  box.append(h('div', null, h('b', null, title), h('ul', null, list.map(x => h('li', null, x)))),
    h('button', {class: 'btn', type: 'button', onclick: () => { box.hidden = true; }}, '關閉'));
}

function enterSample(){
  sampleMode = true; reports = SAMPLES.slice(); cur = reports[reports.length - 1].month;
  $('sampleBanner').hidden = false; render();
}
function leaveSample(rerender = true){
  sampleMode = false; reports = stored; cur = reports.length ? reports[reports.length - 1].month : null;
  $('sampleBanner').hidden = true; if (rerender) render();
}

  const ul = $('mgList'); ul.replaceChildren();

/* 兩個月能不能直接比：任一個月記不到八成的天數、或兩個月完整度差太多，百分比就會誤導 */
const ratio = r => r.coverage.days_with_entry / r.coverage.days_in_month;
function comparable(r, prev){
  if (!prev) return {ok: false, why: '上個月的月報還沒匯入'};
  const a = ratio(r), b = ratio(prev);
  if (b < 0.8) return {ok: false, why: `上月只記 ${prev.coverage.days_with_entry}／${prev.coverage.days_in_month} 天，不能直接比`};
  if (a < 0.8) return {ok: false, why: `本月只記 ${r.coverage.days_with_entry}／${r.coverage.days_in_month} 天，不能直接比`};
  if (Math.abs(a - b) > 0.15) return {ok: false, why: '兩個月記帳天數差太多，不能直接比'};
  return {ok: true};
}

function delta(curV, prevV){
  if (prevV == null) return null;
  if (prevV === 0) return curV === 0 ? '跟上月一樣' : '上月是 0';
  if (curV <= 0 || prevV < 0) { const diff = curV - prevV; return diff === 0 ? '跟上月一樣' : `比上月 ${diff > 0 ? '多' : '少'} ${fmt(Math.abs(diff))}`; }
  const d = (curV - prevV) / Math.abs(prevV);
  if (Math.abs(d) < 0.005) return '跟上月差不多';
  return `比上月 ${d > 0 ? '多' : '少'} ${pct(Math.abs(d))}`;
}

function tilesSec(r, prev){
  const t = r.totals, cmp = comparable(r, prev), pt = cmp.ok ? prev.totals : null;
  const incNames = r.income_by_cat.filter(x => x.amount).map(x => x.name).join('・');
  const tile = (k, v, sub) => h('div', {class: 'card tile'}, h('span', {class: 'k'}, k), h('span', {class: 'v'}, v), h('span', {class: 'sub'}, sub));
  let saveTile;
  if (r.transfers) {
    const sav = r.transfers.filter(x => x.code === 'X1' || x.code === 'X2'), other = r.transfers.filter(x => x.code !== 'X1' && x.code !== 'X2');
    const net = sav.reduce((n, x) => n + x.out - x.in, 0), otherOut = other.reduce((n, x) => n + x.out, 0);
    saveTile = tile('存進儲蓄／投資（淨）', fmt(net), otherOut ? `另有${other.filter(x => x.out).map(x => x.name).join('、')} ${fmt(otherOut)}，都不算支出` : '轉帳不算支出');
  } else saveTile = tile('轉帳合計', fmt(t.capital_transfer_out), '含繳卡費、儲值等，不算支出');
  return h('section', {class: 'tiles', 'aria-label': '本月總覽'},
    tile('消費支出', fmt(t.expense), cmp.ok ? delta(t.expense, pt.expense) : cmp.why),
    tile('收入', fmt(t.income), incNames || '這個月沒有收入紀錄'),
    tile('淨儲蓄', fmt(t.net_savings), t.saving_rate == null ? '沒有收入，無法算儲蓄率' : `儲蓄率 ${pct(t.saving_rate)}` + (pt && pt.saving_rate != null ? `（上月 ${pct(pt.saving_rate)}）` : '')),
    saveTile);
}

function analysisSec(r){
  const a = r.analysis, sec = h('section', {class: 'card', 'aria-labelledby': 'an-h'}, secHead('an-h', '分析與建議', 'Claude 依這個月的帳寫的'));
  if (!a) { sec.append(h('p', {class: 'empty-an'}, '這個月的分析還沒寫。月底跟 Claude 說「幫我寫這個月的分析」，重新匯入月報檔就會出現。')); return sec; }
  const list = (title, items) => items && items.length ? h('div', null, h('h3', null, title), h('ul', null, items.map(x => h('li', null, x)))) : null;
  sec.append(h('p', {class: 'an-head'}, a.headline),
    h('div', {class: 'an-cols'}, list('這個月的發現', a.findings), list('建議', a.advice)));
  if (a.commitment || a.question) sec.append(h('div', {class: 'an-foot'},
    a.commitment ? h('span', null, h('b', null, '下個月的承諾：'), a.commitment) : null,
    a.question ? h('span', null, h('b', null, '想一想：'), a.question) : null));

function distSec(r, prev){
  const total = r.totals.expense;
  const sec = h('section', {class: 'card', 'aria-labelledby': 'ds-h'}, secHead('ds-h', '消費分布', `共 ${fmt(total)}・點類別看細項`));
  const groups = r.groups.filter(g => g.amount !== 0 || g.count);
  if (!groups.length) { sec.append(h('p', {class: 'empty-an'}, '這個月沒有消費支出紀錄。')); return sec; }
  const pos = groups.filter(g => g.amount > 0), posSum = pos.reduce((n, g) => n + g.amount, 0);
  const showPct = total > 0 && posSum > 0;
  if (total <= 0) sec.append(h('p', {class: 'empty-an', style: 'margin-bottom:12px'}, `這個月退款比消費多（淨 ${fmt(total)}），所以不算占比。`));
  if (showPct) {
    const stack = h('div', {class: 'stack', role: 'img', 'aria-label': '各類別占比：' + pos.map(g => `${g.name} ${pct(g.amount / posSum)}`).join('、')});
    for (const g of pos) stack.append(h('i', {style: `flex:${g.amount} 1 0;background:${colorOf(g.code)}`}));
    sec.append(stack);
  }
  const max = Math.max(...groups.map(g => g.amount), 1);
  const cmp = comparable(r, prev);
  const prevGroup = code => (prev.groups.find(x => x.code === code) || {amount: 0, cats: []});
  /* 跟上月比：只在兩個月可比時算；並指出變化最大的細項，避免「某類多 300%」其實只是一筆一次性支出 */
  const change = g => {
    if (!cmp.ok) return null;
    const pg = prevGroup(g.code), d = delta(g.amount, pg.amount);
    if (!d || pg.amount === g.amount) return d;
    let top = null;
    for (const ct of g.cats) { const pa = (pg.cats.find(x => x.code === ct.code) || {amount: 0}).amount, diff = ct.amount - pa; if (!top || Math.abs(diff) > Math.abs(top.diff)) top = {name: ct.name, diff}; }
    for (const pc of pg.cats) if (!g.cats.some(x => x.code === pc.code) && (!top || pc.amount > Math.abs(top.diff))) top = {name: pc.name, diff: -pc.amount};
    return top && g.cats.length + pg.cats.length > 1 && top.diff ? `${d}（主要是${top.name} ${top.diff > 0 ? '+' : '−'}${fmt(Math.abs(top.diff)).replace('−', '')}）` : d;
  };
  const rows = h('div', {class: 'rows'});
  for (const g of [...groups].sort((a, b) => b.amount - a.amount || a.code.localeCompare(b.code))) {
    const sub = h('div', {class: 'subrows', hidden: true});
    for (const ct of g.cats) {
      const fl = FLEX.find(f => f[0] === ct.flex);
      sub.append(h('div', {class: 'subrow'},
        h('span', null, ct.name, fl ? h('span', {class: 'flexnote'}, `・${fl[1]}`) : null),
        h('span', {class: 'track'}, h('i', {class: 'bar', style: `display:block;width:${Math.max(0, ct.amount) / max * 100}%;background:${colorOf(g.code)}`})),
        h('span', {class: 'amt num'}, fmt(ct.amount), h('small', null, `${ct.count} 筆`))));
    }
    const d = change(g), share = showPct ? pct(Math.max(0, g.amount) / posSum) : null;
    const btn = h('button', {class: 'row', type: 'button', 'aria-expanded': 'false'},
      h('span', {class: 'nm'}, h('span', {class: 'chev', 'aria-hidden': 'true'}, '▸'), h('span', {class: 'sw', style: `background:${colorOf(g.code)}`, 'aria-hidden': 'true'}), h('span', {class: 't'}, g.name)),
      h('span', {class: 'track'}, h('i', {class: 'bar', style: `display:block;width:${Math.max(0, g.amount) / max * 100}%;background:${colorOf(g.code)}`})),
      h('span', {class: 'amt num'}, fmt(g.amount), h('small', null, [share, d].filter(Boolean).join('・'))));
    btn.addEventListener('click', () => { const o = btn.getAttribute('aria-expanded') === 'true'; btn.setAttribute('aria-expanded', String(!o)); sub.hidden = o; });
    rows.append(btn, sub);
  }
  sec.append(rows);
  if (!cmp.ok && prev) sec.append(h('p', {class: 'flex-desc'}, `沒有顯示跟上月的比較：${cmp.why}。`));
  sec.append(tableView(['類別', '細項', '金額', '筆數', '占比'],
    groups.flatMap(g => g.cats.map(ct => [g.name, ct.name, fmt(ct.amount), ct.count, showPct ? pct(Math.max(0, ct.amount) / posSum) : '—'])), [2, 3, 4]));
  return sec;
}

function tableView(head, rows, rightCols = []){
  return h('details', {class: 'tbl'}, h('summary', null, '以表格檢視'),
    h('div', {class: 'tblwrap'}, h('table', null,
      h('thead', null, h('tr', null, head.map((x, i) => h('th', {class: rightCols.includes(i) ? 'r' : null}, x)))),
      h('tbody', null, rows.map(r => h('tr', null, r.map((x, i) => h('td', {class: rightCols.includes(i) ? 'r' : null}, x))))))));

function flexSec(r){

    h('span', {class: 'num'}, `${n} ${fmt(f[k])}${share(k)}`)))),

function listSec(id, title, note, items, nameOf){

/* ── 每日支出：單一系列直條。斜線＝沒記帳；淡色＝只有估計補記；什麼都沒有＝記了、沒花錢 ── */
function dailySec(r){
  /* 每日圖畫「日常花費」＝當天支出扣掉固定支出：房租那天不會把整張圖壓扁，平均也才有意義 */
  const days = r.daily.map(d => ({...d, daily: d.expense - (d.fixed || 0), est: d.has_entry === false && d.expense !== 0}));
  const hasFlag = days.some(d => d.has_entry !== undefined), hasEst = days.some(d => d.est);
  const fixedSum = days.reduce((n, d) => n + (d.fixed || 0), 0);
  const entered = days.filter(d => d.has_entry !== false), avg = entered.length ? Math.round(entered.reduce((n, d) => n + d.daily, 0) / entered.length) : 0;
  const legend = ['虛線＝平均', hasFlag ? '斜線＝沒記帳' : '', hasEst ? '淡色＝估計補記' : ''].filter(Boolean).join('・');
  const sec = h('section', {class: 'card', 'aria-labelledby': 'dy-h'}, secHead('dy-h', '每天花多少', `日常花費平均 ${fmt(avg)}／天（只算有記帳的日子）・${legend}`));
  if (fixedSum) sec.append(h('p', {class: 'flex-desc', style: 'margin:-6px 0 10px'}, `不含房租、電信、訂閱這類固定支出（本月共 ${fmt(fixedSum)}）。`));
  const box = h('div', {class: 'chart'});
  sec.append(box);
  const label = d => d.has_entry === false ? (d.est ? `估計補記 ${fmt(d.daily)}` : '沒有記帳') : d.expense === 0 ? '沒花錢' : fmt(d.daily) + (d.fixed ? `（另有固定支出 ${fmt(d.fixed)}）` : '');
  const draw = () => {
    box.replaceChildren();
    const W = Math.max(280, box.clientWidth || 600), H = 200, L = 52, R = 8, T = 10, B = 26;
    const max = Math.max(...days.map(d => d.daily), 1), nice = niceMax(max), y = v => T + (H - T - B) * (1 - Math.max(0, v) / nice);
    const bw = (W - L - R) / days.length, gap = Math.min(2, bw * .25);
    const svg = s('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `每日日常花費直條圖，${days.length} 天，最高 ${fmt(max)}`});
    svg.append(s('defs', null, s('pattern', {id: 'hatch', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)'},
      s('rect', {width: 6, height: 6, fill: 'transparent'}), s('line', {x1: 0, y1: 0, x2: 0, y2: 6, stroke: 'var(--hatch)', 'stroke-width': 1.5}))));
    for (const v of [0, nice / 2, nice]) {
      svg.append(s('line', {x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: v ? 'var(--grid)' : 'var(--axis)', 'stroke-width': 1}));
      svg.append(s('text', {x: L - 6, y: y(v) + 4, 'text-anchor': 'end'}, short(v)));
    }
    days.forEach((d, i) => {
      const x = L + i * bw + gap / 2, w = Math.max(1, bw - gap), day = i + 1;
      if (d.has_entry === false && !d.est) svg.append(s('rect', {x, y: T, width: w, height: H - T - B, fill: 'url(#hatch)', rx: 2}));
      else if (d.daily > 0) svg.append(s('path', {d: roundTop(x, y(d.daily), w, y(0) - y(d.daily)), fill: 'var(--s1)', 'fill-opacity': d.est ? .4 : null}));
      if (day === 1 || day % 5 === 0) svg.append(s('text', {x: x + w / 2, y: H - 8, 'text-anchor': 'middle'}, String(day)));
    });
    if (avg > 0) svg.append(s('line', {x1: L, x2: W - R, y1: y(avg), y2: y(avg), stroke: 'var(--ink-3)', 'stroke-width': 1, 'stroke-dasharray': '4 4'}));
    /* 整張圖一個感應層：用手指的 x 座標換算是哪一天，窄長條也點得到 */
    const hit = s('rect', {x: L, y: 0, width: W - L - R, height: H, fill: 'transparent'});
    hookTip(hit, e => {
      const pt = svg.getBoundingClientRect(), i = Math.max(0, Math.min(days.length - 1, Math.floor(((e.clientX - pt.left) * W / pt.width - L) / bw)));
      return [`${+days[i].date.slice(5, 7)}/${i + 1}`, label(days[i])];
    });
    svg.append(hit);
    box.append(svg);
  };
  onResize(box, draw);
  sec.append(tableView(['日期', '日常花費', '固定支出', '記帳'], days.map(d => [d.date, d.has_entry === false && !d.est ? '—' : fmt(d.daily), d.fixed ? fmt(d.fixed) : '—',
    d.has_entry === false ? (d.est ? '估計' : '沒記帳') : d.expense === 0 ? '沒花錢' : '有']), [1, 2]));
  return sec;
}

/* ── 跨月趨勢：各月消費支出依類別堆疊（同一套類別色） ── */
function trendSec(){
  const sec = h('section', {class: 'card', 'aria-labelledby': 'tr-h'}, secHead('tr-h', '每月趨勢', reports.length > 1 ? `${reports.length > 12 ? '最近 12' : reports.length} 個月` : ''));
  if (reports.length < 2) { sec.append(h('p', {class: 'empty-an'}, '匯入兩個月以上的月報，就會出現每月比較。')); return sec; }
  const months = reports.slice(-12), codes = [...new Set(months.flatMap(r => r.groups.map(g => g.code)))].sort();
  const names = Object.fromEntries(months.flatMap(r => r.groups.map(g => [g.code, g.name])));
  const amt = (r, c) => (r.groups.find(g => g.code === c) || {amount: 0}).amount;
  /* 月份標籤：跨年、或同一個月出現兩次時加上年份 */
  const multiYear = new Set(months.map(r => r.month.slice(0, 4))).size > 1;
  const mLabel = r => multiYear ? `${r.month.slice(2, 4)}/${+r.month.slice(5)}` : `${+r.month.slice(5)}月`;
  const box = h('div', {class: 'chart'});
  const draw = () => {
    box.replaceChildren();
    const W = Math.max(280, box.clientWidth || 600), H = 220, L = 52, R = 8, T = 10, B = 26;
    const max = Math.max(...months.map(r => r.groups.reduce((n, g) => n + Math.max(0, g.amount), 0)), 1), nice = niceMax(max);
    const y = v => T + (H - T - B) * (1 - v / nice), slot = (W - L - R) / months.length, bw = Math.min(56, slot * .6);
    const svg = s('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': '每月消費支出依類別堆疊'});
    for (const v of [0, nice / 2, nice]) {
      svg.append(s('line', {x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: v ? 'var(--grid)' : 'var(--axis)', 'stroke-width': 1}));
      svg.append(s('text', {x: L - 6, y: y(v) + 4, 'text-anchor': 'end'}, short(v)));
    }
    months.forEach((r, i) => {
      const cx = L + slot * i + slot / 2, x = cx - bw / 2;
      const parts = codes.map(c => [c, Math.max(0, amt(r, c))]).filter(p => p[1] > 0);
      /* 有金額的類別每段至少 2px（看得到、滑得到提示）；補上去的高度從同一根柱子裡比 2px 高的段按比例扣回，柱高仍等於真實總額。
         段與段之間的縫最多 2px、但不吃掉那段的最後 2px：畫出來的高度＝max(2, 高度−2)，金額越大一定越高（舊版小段會被縫吃成 0px） */
      const MIN = 2, hs = parts.map(([, v]) => v * (H - T - B) / nice);
      const lift = hs.reduce((n, v) => n + Math.max(0, MIN - v), 0), room = hs.reduce((n, v) => n + Math.max(0, v - MIN), 0), take = Math.min(lift, room);
      for (let j = 0; j < hs.length; j++) hs[j] = hs[j] < MIN ? MIN : hs[j] - (room ? take * (hs[j] - MIN) / room : 0);
      let base = y(0);
      parts.forEach(([c, v], j) => {
        const top = j === parts.length - 1, segTop = base - hs[j], gap = top ? 0 : Math.min(2, Math.max(0, hs[j] - MIN));
        const seg = top ? s('path', {d: roundTop(x, segTop, bw, hs[j]), fill: colorOf(c)}) : s('rect', {x, y: segTop + gap, width: bw, height: hs[j] - gap, fill: colorOf(c)});
        hookTip(seg, () => [`${monthLabel(r.month)}・${names[c]}`, fmt(v)]);
        svg.append(seg); base = segTop;
      });
      if (slot >= 30 || i % 2 === 0 || i === months.length - 1) svg.append(s('text', {x: cx, y: H - 8, 'text-anchor': 'middle'}, mLabel(r)));
    });
    box.append(svg);
  };
  onResize(box, draw);
  sec.append(box, h('div', {class: 'legend'}, codes.map(c => h('span', null, h('i', {class: 'sw', style: `background:${colorOf(c)}`, 'aria-hidden': 'true'}), names[c]))),
    tableView(['月份', '消費支出', ...codes.map(c => names[c]), '收入', '淨儲蓄', '儲蓄率', '記帳天數'], months.map(r => [monthLabel(r.month), fmt(r.totals.expense),
      ...codes.map(c => fmt(amt(r, c))), fmt(r.totals.income), fmt(r.totals.net_savings), r.totals.saving_rate == null ? '—' : pct(r.totals.saving_rate),
      `${r.coverage.days_with_entry}／${r.coverage.days_in_month}`]), Array.from({length: codes.length + 5}, (_, i) => i + 1)));
  return sec;
}

/* ── 圖表小工具 ── */
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
function short(v){ const f = x => String(+x.toFixed(2)); return v >= 1e4 ? f(v / 1e4) + '萬' : v >= 1e3 ? f(v / 1e3) + '千' : String(v); }
function roundTop(x, y, w, hgt){
  const r = Math.min(4, w / 2, hgt);
  if (hgt <= 0) return '';
  return `M${x},${y + hgt}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + hgt}Z`;
}
const resizeFns = new Set();
function onResize(box, draw){ resizeFns.add(draw); requestAnimationFrame(draw); }
let rzT; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => resizeFns.forEach(f => f()), 120); });
const tip = $('tip');
/* 提示框：滑鼠移上去顯示；手指點一下顯示並固定，點圖表外面才收起 */
function hookTip(el, linesOf){
  el.setAttribute('data-tip', '');
  const show = e => {
    const lines = linesOf(e);
    tip.replaceChildren(h('b', null, lines[0]), lines[1]); tip.hidden = false;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(innerWidth - tw - 8, Math.max(8, e.clientX - tw / 2)) + 'px';
    tip.style.top = Math.max(8, e.clientY - th - 12) + 'px';
  };
  el.addEventListener('pointermove', show); el.addEventListener('pointerdown', show);
  el.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') hideTip(); });
}
function hideTip(){ tip.hidden = true; }
addEventListener('scroll', hideTip, {passive: true});
document.addEventListener('pointerdown', e => { if (!e.target.closest('[data-tip]')) hideTip(); });

/* ══ 事件 ══ */
$('importBtn').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => { const f = [...e.target.files]; e.target.value = ''; if (f.length) importFiles(f); });
$('sampleBtn').addEventListener('click', enterSample);
$('leaveSample').addEventListener('click', () => leaveSample());
$('manageBtn').addEventListener('click', () => { const m = $('manage'), o = m.hidden; m.hidden = !o; $('manageBtn').setAttribute('aria-expanded', String(o)); });
$('wipeBtn').addEventListener('click', async () => {
  const b = $('wipeBtn');
  if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = '再按一次：刪除這台裝置上的全部月報'; setTimeout(() => { b.dataset.armed = ''; b.textContent = '刪除全部月報'; }, 4000); return; }
  b.dataset.armed = ''; b.textContent = '刪除全部月報';
  try { await DB.clear(); } catch (e) { toast('刪除失敗，請重新整理頁面再試一次'); return; }
  await load(); if (!sampleMode) cur = null; render(); toast('已刪除這台裝置上的全部月報');
});
let dragN = 0;
addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { dragN++; $('drop').hidden = false; } });
addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('drop').hidden = true; } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('drop').hidden = true; const f = [...(e.dataTransfer?.files || [])]; if (f.length) importFiles(f); });
addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });

(async () => {
  await DB.open(); await load();
  cur = reports.length ? reports[reports.length - 1].month : null;
  render();
  if (skipped.length) showErrors(skipped, `這台裝置存的月報有 ${skipped.length} 個月不符合目前網頁的格式，先不顯示（重新匯入那個月新產生的月報檔就會取代）`);
  if (!DB.ok) toast('這個瀏覽器不能長期儲存（可能是私密瀏覽），匯入的月報關掉頁面就會消失');
})();
</script>
