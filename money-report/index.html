function overview(){const r=M.monthReport(state,month,today),tot=M.totals(state,today,rateTable());const recent=state.transactions.filter(t=>t.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt)).slice(0,5);return `${onboarding()}${hasForeign()?fxPanel():''}<div class="stats">${stat('本月結餘',money(r.net),'收入減去淨支出',true)}${stat('本月收入',money(r.income),'不含轉帳與期初餘額')}${stat('本月支出',money(r.expense),r.refunds?'已扣除退款 '+money(r.refunds):'依已登錄消費')}${stat('今日淨資產',money(tot.net),tot.incomplete?'缺少匯率，總額暫不完整':hasForeign()?'依最新可得參考價折合 TWD':'總資產減去負債')}</div><div class="grid-main"><section class="panel"><div class="section-head"><div><h2>消費分佈</h2><p class="muted">日常花費的樣子</p></div><button class="text-button" data-view="analysis">完整分析 ↗</button></div>${distribution(r)}</section><section class="panel"><div class="section-head"><h2>本月預算</h2><button class="text-button" data-action="budget">編輯</button></div>${budgetPanel(r)}</section></div><section class="panel"><div class="section-head"><h2>最近的紀錄</h2><button class="text-button" data-view="records">查看全部 ↗</button></div>${recent.length?`<div class="transaction-list">${recent.map(t=>txRow(t)).join('')}</div>`:empty('第一筆，就從今天開始','收入、支出與帳戶間轉帳，都能在這裡記下。','add-transaction','＋ 記一筆')}</section>`;}
function filtered(){return state.transactions.filter(t=>(filter.all||t.date.startsWith(month))&&(!filter.kind||t.kind===filter.kind)&&(!filter.account||t.accountId===filter.account||t.toAccountId===filter.account)&&(!filter.category||t.categoryId===filter.category)&&(!filter.query||[t.note,category(t.categoryId)?.name,accountName(t.accountId),t.toAccountId?accountName(t.toAccountId):'',typeNames[t.kind],t.date,rawAmount(t.amount),account(t.accountId)?.currency,rawAmount(t.nativeAmount,account(t.accountId)?.currency)].join(' ').toLowerCase().includes(filter.query.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));}
function recordsContent(){const rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/40));page=Math.min(page,pages);const slice=rows.slice((page-1)*40,page*40);let last='';return `<div class="list-toolbar"><span class="list-summary">找到 ${rows.length.toLocaleString()} 筆紀錄${filter.all?' · 全部月份':''}</span><button class="text-button" data-action="export-filtered">匯出篩選結果 CSV ↗</button></div><section class="panel">${slice.length?slice.map(t=>{let out='';if(t.date!==last){last=t.date;out=`<p class="date-heading">${e(t.date.replaceAll('-',' / '))}</p>`;}return out+txRow(t);}).join(''):empty('沒有符合的紀錄','試著調整篩選條件，或新增一筆收支。','add-transaction','＋ 記一筆')}</section>${pages>1?`<div class="pagination"><button class="button small" data-action="page-prev" ${page===1?'disabled':''}>上一頁</button><span>${page} / ${pages}</span><button class="button small" data-action="page-next" ${page===pages?'disabled':''}>下一頁</button></div>`:''}`;}
function records(){return `<div class="filters"><label><span class="field-label">搜尋</span><input id="filter-query" type="search" maxlength="120" placeholder="備註、分類、金額或帳戶" value="${e(filter.query)}"></label><label><span class="field-label">類型</span><select id="filter-kind">${option('','全部類型',filter.kind)}${Object.entries(typeNames).map(([id,name])=>option(id,name,filter.kind)).join('')}</select></label><label><span class="field-label">帳戶</span><select id="filter-account">${option('','所有帳戶',filter.account)}${state.accounts.map(a=>option(a.id,a.name,filter.account)).join('')}</select></label><label><span class="field-label">分類</span><select id="filter-category">${option('','所有分類',filter.category)}${[...M.categories.expense,...M.categories.income].map(c=>option(c.id,c.name,filter.category)).join('')}</select></label></div><label class="checkbox-line" style="margin-bottom:18px"><input id="filter-all" type="checkbox" ${filter.all?'checked':''}>跨所有月份查詢</label><div id="records-region">${recordsContent()}</div>`;}
function accounts(){const t=M.totals(state,asOf,rateTable()),rows=M.balances(state,asOf,rateTable());return `<div class="as-of"><span class="muted">餘額截止日</span><input id="as-of" aria-label="餘額截止日" type="date" max="${today}" value="${asOf}" required><button class="button primary small" data-action="add-account">＋ 新增帳戶</button></div>${fxPanel()}${t.incomplete?`<p class="fx-warning" role="status">缺少 ${e(t.missingCurrencies.join('、'))} 匯率，相關資產總額暫不顯示；原幣餘額仍完整保留。</p>`:''}<div class="stats">${stat('淨資產 · TWD',money(t.net),'資產 − 負債',true)}${stat('總資產 · TWD',money(t.assets),'所有帳戶的正餘額')}${stat('總負債 · TWD',money(t.liabilities),'所有帳戶的負餘額')}${stat('存款與現金 · TWD',money(t.cash),'含外幣帳戶換算餘額')}</div>${rows.length?`<div class="accounts-grid">${rows.map(a=>`<article class="account-card${a.archived?' archived':''}"><div class="account-title"><div><h3>${e(a.name)}</h3><p class="account-type">${e(accountType(a.type)?.name||a.type)} <span class="currency-badge">${e(a.currency)}</span>${a.archived?' · 已封存':''}</p></div><span class="transaction-icon">${icon('wallet')}</span></div><p class="account-balance ${a.balance<0?'expense':''}">${e(nativeMoney(Math.abs(a.balance),a.currency))}</p>${a.currency!=='TWD'?`<p class="fx-amount-base">${a.balanceTwd===null?'尚無匯率，暫不估值':'參考折合 '+e(money(Math.abs(a.balanceTwd)))}</p>`:''}<p class="note">${a.openingDate>asOf?'此截止日尚未建立':a.balance<0?'待償還餘額':isLiability(a.type)&&a.balance>0?'預付／溢繳餘額':'帳戶餘額'} · ${e(asOf)}</p><div class="account-actions"><button class="text-button" data-action="edit-account" data-id="${e(a.id)}">編輯</button>${!a.archived?`<button class="text-button" data-action="adjust-account" data-id="${e(a.id)}">校正目前餘額</button>`:''}<button class="text-button" data-action="account-records" data-id="${e(a.id)}">交易明細 ↗</button></div></article>`).join('')}</div>`:`<section class="panel">${empty('把常用帳戶放在一起','新增銀行、外匯、現金或信用卡帳戶，選擇幣別並填入期初餘額。','add-account','＋ 新增帳戶')}</section>`}<p class="note">原幣餘額截至選定日期；外幣按目前可得參考價換算，並非該截止日的歷史估值。未連線銀行；投資帳戶仍為手動帳面餘額。封存帳戶保留餘額與歷史。</p>`;}
function trendPanel(){const rows=M.trend(state,month,6),max=Math.max(1,...rows.flatMap(x=>[x.income,Math.max(0,x.expense)]));return `<div class="trend-chart" role="img" aria-label="最近六個月收入與淨支出，展開下方表格可查看完整金額">${rows.map(r=>`<div class="trend-column"><div class="trend-bars"><div class="trend-bar in" style="height:${r.income/max*100}%" title="${e(r.month)} 收入 ${e(money(r.income))}"></div><div class="trend-bar out" style="height:${Math.max(0,r.expense)/max*100}%" title="${e(r.month)} 淨支出 ${e(money(r.expense))}"></div></div><span class="trend-month">${r.month.slice(5)} 月</span></div>`).join('')}</div><div class="chart-key"><span><i style="background:#8daf9d"></i>收入</span><span><i style="background:#2a6153"></i>淨支出</span></div><details class="data-table"><summary>查看每月完整數字</summary><table><thead><tr><th>月份</th><th>收入</th><th>淨支出</th><th>結餘</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${e(r.month)}</td><td>${e(money(r.income))}</td><td>${e(money(r.expense))}</td><td>${e(money(r.net))}</td></tr>`).join('')}</tbody></table><p class="note">當月為目前累積值；退款高於支出時，負淨支出只列在表格。</p></details>`;}
function analysis(){const r=M.monthReport(state,month,today);const configured=state.budgets[month]?.categories||{};const limits=M.categories.expense.filter(c=>configured[c.id]>0);const biggest=state.transactions.filter(t=>t.date.startsWith(month)&&t.kind==='expense').sort((a,b)=>b.amount-a.amount).slice(0,5);return `<p class="note">分析與預算以新臺幣計算；外幣收支採各筆儲存時的入帳匯率，後續行情不會改寫歷史。</p><div class="stats">${stat('本月收入',money(r.income),'依已登錄收入')}${stat('本月淨支出',money(r.expense),'支出扣除退款')}${stat('本月結餘',money(r.net),'收入 − 淨支出',true)}${stat('收支結餘率',r.savingRate===null?'—':(r.savingRate*100).toFixed(1)+'%',r.savingRate===null?'沒有收入，暫不計算':'本月結餘 ÷ 收入')}</div>${r.count?`<div class="tips">${r.tips.map((t,i)=>`<article class="tip ${t.tone==='warning'||t.tone==='warn'?'warning':''}"><span class="tip-number">0${i+1}</span><h3>${e(t.title)}</h3><p>${e(t.detail)}</p></article>`).join('')}</div>`:`<section class="panel" style="margin-bottom:20px">${empty('先記錄，再看見變化','這個月還沒有收支資料，不會產生推測的分析或建議。','add-transaction','＋ 記一筆')}</section>`}<p class="note" style="margin:-2px 0 20px">分析依已登錄紀錄自動計算，不代表完整財務狀況。${r.comparison?.label?e(r.comparison.label):''}</p><div class="grid-equal"><section class="panel"><div class="section-head"><h2>消費分佈</h2><span class="muted">${r.count} 筆收支</span></div>${distribution(r)}</section><section class="panel"><div class="section-head"><h2>六個月收支趨勢</h2></div>${trendPanel()}</section></div><div class="grid-equal"><section class="panel"><div class="section-head"><h2>預算追蹤</h2><button class="text-button" data-action="budget">設定預算</button></div>${budgetPanel(r)}${limits.length?`<h3 class="subheading">分類上限</h3><div class="budget-list">${limits.map(c=>{const used=r.groups.find(g=>g.id===c.id)?.net||0,limit=configured[c.id];return `<div><div class="budget-number"><span>${e(c.name)}</span><strong>${e(money(used))} / ${e(money(limit))}</strong></div><div class="progress-track ${used>limit?'over':''}"><span style="width:${Math.max(0,Math.min(100,used/limit*100))}%"></span></div><p class="note" style="margin-top:5px">${used>limit?'超出 '+e(money(used-limit)):'剩餘 '+e(money(limit-used))}</p></div>`;}).join('')}</div>`:''}</section><section class="panel"><div class="section-head"><h2>本月較大的支出</h2><button class="text-button" data-view="records">看明細 ↗</button></div><div class="top-spends">${biggest.length?biggest.map((t,i)=>txRow(t,i+1)).join(''):empty('尚無支出紀錄','有消費紀錄後，這裡會列出金額最高的五筆。')}</div></section></div>`;}
function settings(){return `<div class="settings-grid"><section class="panel"><h2>備份與還原</h2><p>帳目只存在這個瀏覽器。換裝置前、清除瀏覽資料前，請先下載一份備份。</p><div class="facts"><div><span>帳戶</span><strong>${state.accounts.length} 個</strong></div><div><span>交易紀錄</span><strong>${state.transactions.length.toLocaleString()} 筆</strong></div><div><span>最近備份</span><strong>${state.settings.lastBackupAt?e(new Date(state.settings.lastBackupAt).toLocaleString('zh-TW')):'尚未備份'}</strong></div></div><div class="button-row"><button class="button primary" data-action="backup">下載完整備份</button><button class="button" data-action="restore">還原備份</button><button class="button" data-action="export-all">匯出明細 CSV</button></div><p class="note">完整備份包含幣別、原幣金額、交易入帳匯率、所有帳戶與預算。CSV 適合查閱，還原請使用 JSON 備份。</p></section><section class="panel"><h2>原本的月報，也留在這裡</h2><p>先前匯入的月報與分析繼續保留。月報是摘要資料，不會自動變成交易，也不會加入新帳本餘額。</p><div class="button-row"><a class="button" href="report-viewer.html">開啟月報檢視器 ↗</a></div><p class="note">月報檢視器支援原本的 money-report/1 月報檔與虛構示範資料。</p></section><section class="panel"><h2>資料保存</h2><p>這份帳本沒有銀行連線，也不會把帳目上傳到伺服器。不同瀏覽器、裝置之間不會自動同步。只有外幣匯率會向公開來源取得；請求不包含你的帳戶、金額或交易。</p><div class="button-row"><button class="button" data-action="persist">申請瀏覽器持久保存</button></div><p class="note" id="persist-status">持久保存可降低瀏覽器自動清除的機會，仍需要定期備份。</p></section><section class="panel"><h2>記帳方式</h2><div class="facts"><div><span>日常消費</span><strong>記「支出」</strong></div><div><span>信用卡還款、帳戶互轉</span><strong>記「轉帳」</strong></div><div><span>退貨退款</span><strong>記「退款」</strong></div><div><span>對帳差異、投資估值</span><strong>「校正目前餘額」</strong></div></div><p class="note">信用卡與借款以欠款管理。餘額校正不算收入或支出，請保留原因。</p></section></div>`;}
function render(){if(!ready)return;syncClock();const v=views.find(x=>x.id===view);$('nav').innerHTML=views.map(x=>`<button class="nav-button" data-view="${x.id}"${x.id===view?' aria-current="page"':''}>${icon(x.icon)}${x.label}</button>`).join('');$('page-title').textContent=v?.title||'資料與設定';$('page-subtitle').textContent=v?.sub||'把帳本留在自己手上，也把資料照顧好。';$('page-eyebrow').textContent=view==='analysis'?monthName(month)+' · 月度回顧':'讓每一筆，都有著落';$('month-picker').hidden=view==='accounts'||view==='settings';$('month').value=month;$('month').max=currentMonth;document.querySelector('[data-action="previous-month"]').disabled=month<='1900-01';document.querySelector('[data-action="next-month"]').disabled=month>=currentMonth;$('quick-add').disabled=false;$('main').innerHTML=view==='overview'?overview():view==='records'?records():view==='accounts'?accounts():view==='analysis'?analysis():settings();}
function showDialog(title,body,handler,submitLabel='儲存'){if(dialog.open)dialog.close();$('dialog-title').textContent=title;$('dialog-body').innerHTML=body;$('dialog-error').hidden=true;$('save-button').textContent=submitLabel;dialogSubmit=handler;dialog.showModal();}
function confirmAction(title,description,handler,label='確認'){showDialog(title,`<p class="muted">${e(description)}</p>`,async()=>{await handler();},label);}
function field(label,content,wide=false,hint=''){return `<label class="field${wide?' wide':''}"><span>${label}</span>${content}${hint?`<small>${hint}</small>`:''}</label>`;}
function openTransaction(id){
 const t=state.transactions.find(x=>x.id===id);if(!t&&!activeAccounts().length){openAccount();notify('先建立第一個帳戶，就能開始記帳');return;}
 const kind=t?.kind||'expense',selected=t?.accountId||activeAccounts().find(a=>a.id===state.settings.defaultAccountId)?.id||activeAccounts()[0]?.id,a=account(selected),date=t?.date||(month===currentMonth?today:endOfMonth(month));
 txDraft={quote:t?.rateSnapshot||latestQuote(a.currency),rateTouched:!!t,targetTouched:!!t,sourceCurrency:a.currency,targetCurrency:account(t?.toAccountId)?.currency||''};
 showDialog(t?'編輯這筆紀錄':'記下這一筆',`<div class="form-grid">${field('類型',`<select name="kind" id="tx-kind">${(kind==='adjustment'?['adjustment']:['expense','income','transfer','refund']).map(k=>option(k,typeNames[k],kind)).join('')}</select>`)}${field('日期',`<input type="date" name="date" value="${e(date)}" max="${today}" required>`)}${field('帳戶',`<select name="accountId" id="tx-account" required>${accountOptions(selected)}</select>`)}<label class="field" id="tx-category-field"><span>分類</span><select name="categoryId" id="tx-category"></select></label><label class="field wide"><span id="tx-amount-label">原幣金額 · ${a.currency}</span><input class="amount-input" id="tx-amount" name="amount" inputmode="decimal" type="text" placeholder="0" value="${t?e(rawAmount(t.nativeAmount,a.currency)):''}" maxlength="20" autocomplete="off" required></label><div class="field wide" id="tx-rate-fields"><div class="form-grid">${field('入帳匯率 · 1 原幣 = 多少 TWD',`<input id="tx-rate" name="rate" inputmode="decimal" maxlength="30" value="${txDraft.quote?e(txDraft.quote.rate):''}" placeholder="自動載入，可改填銀行匯率">`)}${field('匯率日期',`<input id="tx-rate-date" type="date" value="${txDraft.quote?.rateDate||today}" max="${today}">`)}</div><button type="button" class="text-button" data-action="use-latest-rate">使用最新可得參考價</button><p class="note" id="tx-rate-help"></p><p class="note">${fxAttribution()} · 每日更新，非銀行成交價。</p></div><label class="field wide" id="tx-to-field"><span>轉入帳戶</span><select name="toAccountId" id="tx-to"><option value="">選擇轉入帳戶</option>${accountOptions(t?.toAccountId)}</select></label><div class="field wide" id="tx-target-field"><label><span class="field-label" id="tx-target-label">實際轉入金額</span><input id="tx-target-amount" name="toAmount" inputmode="decimal" maxlength="20" value="${t?.toAccountId?e(rawAmount(t.toNativeAmount,account(t.toAccountId).currency)):''}"></label><button type="button" class="text-button" data-action="estimate-transfer">依目前參考價估算</button><p class="note">估算未含手續費與銀行價差，可直接改填實收金額。另列的手續費請記一筆支出。</p></div><p class="fx-preview field wide" id="tx-preview" aria-live="polite"></p>${field('備註',`<input name="note" maxlength="300" value="${e(t?.note||'')}" placeholder="例如：午餐、十月薪資" autocomplete="off">`,true)}</div><p class="note" id="tx-hint"></p>${t?`<div class="danger-zone"><button type="button" class="text-button expense" data-action="delete-transaction" data-id="${e(t.id)}">刪除這筆紀錄</button></div>`:''}`,async fd=>{
 const k=fd.get('kind'),source=account(fd.get('accountId')),target=account(fd.get('toAccountId')),n=M.parseAmount(fd.get('amount'),{signed:k==='adjustment',currency:source.currency}),financial=['expense','income','refund'].includes(k),q=financial?transactionQuote():null;
 const to=k==='transfer'?(target?.currency===source.currency?n:M.parseAmount(fd.get('toAmount'),{currency:target?.currency})):null;
 const value={id:t?.id||uid(),date:fd.get('date'),kind:k,amount:financial?M.convertToTwd(n,source.currency,q?.rate||1):null,nativeAmount:n,toNativeAmount:to,rateSnapshot:q,actualRateSnapshot:k==='transfer'&&target.currency!==source.currency?M.makeActualRateSnapshot(source.currency,target.currency,n,to):null,accountId:source.id,toAccountId:k==='transfer'?target?.id||'':'',categoryId:financial?fd.get('categoryId'):'',note:fd.get('note').trim(),createdAt:t?.createdAt||new Date().toISOString()};
 M.validateTransaction(value,state);await update(s=>{const i=s.transactions.findIndex(x=>x.id===value.id);if(i>=0)s.transactions[i]=value;else s.transactions.push(value);if(!s.accounts.find(a=>a.id===value.accountId)?.archived)s.settings.defaultAccountId=value.accountId;});notify(t?'已更新這筆紀錄':'已記下一筆');
 });updateTransactionFields(kind,t?.categoryId);if(a.currency!=='TWD')void refreshFx();
}
function updateTransactionFields(kind,selected){const categories=kind==='income'?M.categories.income:M.categories.expense,hasCategory=['expense','income','refund'].includes(kind);$('tx-category-field').hidden=!hasCategory;$('tx-category').disabled=!hasCategory;$('tx-category').required=hasCategory;$('tx-category').innerHTML=categories.map(c=>option(c.id,c.name,selected)).join('');$('tx-to-field').hidden=kind!=='transfer';$('tx-to').disabled=kind!=='transfer';$('tx-to').required=kind==='transfer';$('tx-hint').textContent=kind==='transfer'?'帳戶互轉與信用卡還款不計入收入或消費。':kind==='refund'?'退款會加回收款帳戶，並沖減退款當月的分類支出。':kind==='adjustment'?'帳戶對帳差額，不計入月收入或支出。':'日期須在帳戶期初日期之後，且不得晚於今天。';updateTransactionPreview();}
function openAccount(id){const a=state.accounts.find(x=>x.id===id),used=a&&state.transactions.some(t=>t.accountId===id||t.toAccountId===id);showDialog(a?'編輯帳戶':'新增常用帳戶',`<p class="form-hint">選擇帳戶實際使用的幣別，金額以原幣輸入。期初餘額請填「尚未包含之後要登錄交易」的金額。</p><div class="form-grid">${field('帳戶名稱',`<input name="name" maxlength="60" placeholder="例如：日常銀行、美元存款" value="${e(a?.name||'')}" required>`,true)}${field('類型',`<select name="type" id="account-type" ${used?'disabled':''}>${M.accountTypes.map(t=>option(t.id,t.name,a?.type||'bank')).join('')}</select>`)}${field('帳戶幣別',`<select name="currency" id="account-currency" ${used?'disabled':''}>${currencyOptions(a?.currency||'TWD')}</select>`)}${field('期初日期',`<input name="openingDate" type="date" value="${a?.openingDate||today}" max="${today}" ${used?'disabled':''} required>`,true)}<label class="field wide"><span id="account-opening-label">期初餘額／欠款</span><input id="account-opening" name="openingBalance" inputmode="decimal" type="text" value="${a?e(rawAmount(isLiability(a.type)?-a.openingBalance:a.openingBalance,a.currency)):'0'}" maxlength="20" ${used?'disabled':''} required><small>${used?'已有交易，幣別、類型與期初資料已鎖定。請使用「校正目前餘額」對帳。':'資產帳戶填存款；負債帳戶填欠款。負數代表透支或信用卡溢繳。'}</small></label><p id="account-fx-preview" class="fx-preview field wide" aria-live="polite"></p></div><p class="note">外幣資產採每日參考匯率估值。${fxAttribution()}</p>${a?`<div class="danger-zone"><button type="button" class="text-button" data-action="archive-account" data-id="${e(a.id)}">${a.archived?'重新啟用帳戶':'封存這個帳戶'}</button>${!used?`<button type="button" class="text-button expense" style="margin-left:20px" data-action="delete-account" data-id="${e(a.id)}">刪除未使用帳戶</button>`:''}</div>`:''}`,async fd=>{const type=used?a.type:fd.get('type'),currency=used?a.currency:fd.get('currency'),amount=used?a.openingBalance:M.parseAmount(fd.get('openingBalance'),{signed:true,currency})*(isLiability(type)?-1:1);const value={id:a?.id||uid(),name:fd.get('name').trim(),type,currency,openingDate:used?a.openingDate:fd.get('openingDate'),openingBalance:amount,archived:a?.archived||false};await update(s=>{const i=s.accounts.findIndex(x=>x.id===value.id);if(i>=0)s.accounts[i]=value;else s.accounts.push(value);if(!s.settings.defaultAccountId)s.settings.defaultAccountId=value.id;});maybeRefreshFx();notify(a?'已更新帳戶':'帳戶已建立，可以開始記帳');});updateAccountPreview();if(a?.currency&&a.currency!=='TWD')void refreshFx();}
function adjustAccount(id){const a=account(id),balance=M.balances(state,today).find(x=>x.id===id)?.balance||0,debt=isLiability(a.type);showDialog('校正目前餘額',`<p class="form-hint">${e(a.name)} · 目前${debt?'欠款':'餘額'} ${e(nativeMoney(debt?-balance:balance,a.currency))}。填入今天對帳後的實際原幣金額，差額會留下一筆校正紀錄。</p><div class="form-grid">${field(`${debt?'實際欠款':'實際餘額'} · ${a.currency}`,`<input class="amount-input" name="balance" inputmode="decimal" maxlength="20" value="${e(rawAmount(debt?-balance:balance,a.currency))}" required>`,true)}${field('校正原因',`<input name="note" maxlength="300" placeholder="例如：核對銀行餘額、投資估值更新" required>`,true)}</div><p class="note">只改變原幣餘額，不算收入或支出。${debt?'信用卡溢繳可輸入負數。':''}</p>`,async fd=>{const desired=M.parseAmount(fd.get('balance'),{signed:true,currency:a.currency})*(debt?-1:1),delta=desired-balance;if(!delta)throw new Error('餘額沒有變動，不需要校正。');await update(s=>s.transactions.push({id:uid(),date:today,kind:'adjustment',amount:null,nativeAmount:delta,toNativeAmount:null,rateSnapshot:null,actualRateSnapshot:null,accountId:id,toAccountId:'',categoryId:'',note:fd.get('note').trim(),createdAt:new Date().toISOString()}));notify('已儲存餘額校正');});}
function budgetDialog(){const budgetMonth=month;const b=state.budgets[budgetMonth]||{total:0,categories:{}};showDialog(monthName(budgetMonth)+'預算',`<p class="form-hint">總預算與分類上限各自追蹤，不會相加。留白或 0 表示不設上限。</p>${field('本月總預算 · NT$',`<input class="amount-input" name="total" inputmode="decimal" maxlength="20" value="${b.total?e(rawAmount(b.total)):''}" placeholder="0">`)}<h3 class="subheading">分類預算（選填）</h3><div class="category-budgets">${M.categories.expense.map(c=>field(e(c.name),`<input name="budget:${e(c.id)}" inputmode="decimal" maxlength="20" placeholder="不設上限" value="${b.categories[c.id]?e(rawAmount(b.categories[c.id])):''}">`)).join('')}</div>`,async fd=>{const next={total:fd.get('total').trim()?M.parseAmount(fd.get('total')):0,categories:{}};for(const c of M.categories.expense){const text=fd.get('budget:'+c.id).trim();if(text)next.categories[c.id]=M.parseAmount(text);}await update(s=>s.budgets[budgetMonth]=next);notify('本月預算已儲存');});}
function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function backup(){if(!ready)return;const stamp=new Date().toISOString();download(`收支日常-完整備份-${today}-${Date.now()}.json`,JSON.stringify(state),'application/json');try{await update(s=>s.settings.lastBackupAt=stamp);notify('備份已下載，請妥善保存');}catch(err){notify('備份已下載；備份時間未能儲存：'+err.message);}}
function csv(rows){const cell=x=>{let v=String(x??'');if(/^[\s]*[=+\-@]/.test(v))v="'"+v;return '"'+v.replaceAll('"','""')+'"';};const out=[['日期','類型','原幣','原幣金額','入帳金額（TWD）','帳戶','轉入帳戶','轉入幣別','實際轉入金額','入帳匯率（TWD/原幣）','匯率日期','匯率來源','分類','備註'],...rows.map(t=>{const a=account(t.accountId),b=account(t.toAccountId);return [t.date,typeNames[t.kind],a.currency,rawAmount(t.nativeAmount,a.currency),rawAmount(t.amount),a.name,b?.name||'',b?.currency||'',b?rawAmount(t.toNativeAmount,b.currency):'',t.rateSnapshot?.rate??'',t.rateSnapshot?.rateDate||'',t.rateSnapshot?.source||'',category(t.categoryId)?.name||'',t.note];})];download(`收支日常-明細-${today}.csv`,'\uFEFF'+out.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');notify('CSV 已下載');}
async function restore(file){if(!file)return;if(file.size>45*1024*1024)throw new Error('備份檔超過 45 MB。');let parsed;try{parsed=JSON.parse(await file.text());}catch{throw new Error('這不是有效的 JSON 備份檔。');}const imported=M.validateState(parsed);showDialog('還原完整帳本',`<p class="form-hint">此操作會用備份取代目前的新帳本；原本的月報檢視器資料不受影響。</p><div class="restore-summary"><strong>備份：${imported.accounts.length} 個帳戶 / ${imported.transactions.length.toLocaleString()} 筆交易</strong><span>目前：${state.accounts.length} 個帳戶 / ${state.transactions.length.toLocaleString()} 筆交易</span><button type="button" class="text-button" data-action="backup">先下載目前帳本的備份 ↗</button></div><label class="checkbox-line"><input type="checkbox" name="confirmed" required>我已確認備份內容，並同意取代目前帳本。</label>`,async fd=>{if(fd.get('confirmed')!=='on')throw new Error('請先確認還原內容。');await update(s=>{s.accounts=imported.accounts;s.transactions=imported.transactions;s.budgets=imported.budgets;s.settings=imported.settings;});filter={query:'',kind:'',account:'',category:'',all:false};maybeRefreshFx();notify('帳本已還原');},'確認還原');}
form.addEventListener('submit',async event=>{event.preventDefault();if(busy||!dialogSubmit)return;$('dialog-error').hidden=true;$('save-button').disabled=true;try{await dialogSubmit(new FormData(form));dialog.close();}catch(err){$('dialog-error').textContent=err.message||'儲存失敗，請再試一次。';$('dialog-error').hidden=false;}finally{$('save-button').disabled=false;}});
dialog.addEventListener('cancel',event=>{if(busy)event.preventDefault();else setTimeout(reload,0);});
document.addEventListener('click',async event=>{const button=event.target.closest('[data-action],[data-view]');if(!button||button.disabled)return;if(button.dataset.view){setView(button.dataset.view);return;}const id=button.dataset.id;try{switch(button.dataset.action){case 'refresh-fx':await refreshFx(true);break;case 'use-latest-rate':{const draft=txDraft,context=txContext();await refreshFx();if(!dialog.open||!$('tx-account')||draft!==txDraft||context!==txContext())break;if(!latestQuote(selectedTxAccount().currency))throw new Error('暫無可用參考價，請手動輸入銀行實際匯率。');selectLatestRate();updateTransactionPreview();break;}case 'estimate-transfer':{const draft=txDraft,context=txContext();await refreshFx();if(!dialog.open||!$('tx-account')||draft!==txDraft||context!==txContext())break;const a=selectedTxAccount(),b=account($('tx-to').value);if(!b||!latestQuote(a.currency)||!latestQuote(b.currency))throw new Error('暫無換算所需匯率，請直接填寫實際轉入金額。');txDraft.targetTouched=false;suggestTransferAmount();updateTransactionPreview();break;}case 'add-transaction':openTransaction();break;case 'edit-transaction':openTransaction(id);break;case 'add-account':openAccount();break;case 'edit-account':openAccount(id);break;case 'adjust-account':adjustAccount(id);break;case 'budget':budgetDialog();break;case 'close-dialog':if(!busy){dialog.close();await reload();}break;case 'previous-month':if(month>'1900-01'){month=shiftMonth(month,-1);page=1;render();}break;case 'next-month':if(month<currentMonth){month=shiftMonth(month,1);page=1;render();}break;case 'filter-category':filter.category=id;filter.kind='';filter.all=false;page=1;setView('records');break;case 'account-records':filter.account=id;filter.all=true;page=1;setView('records');break;case 'page-prev':page=Math.max(1,page-1);$('records-region').innerHTML=recordsContent();break;case 'page-next':page++;$('records-region').innerHTML=recordsContent();break;case 'backup':await backup();break;case 'restore':$('restore-file').click();break;case 'export-filtered':csv(filtered());break;case 'export-all':csv([...state.transactions].sort((a,b)=>a.date.localeCompare(b.date)));break;case 'delete-transaction':confirmAction('刪除這筆紀錄？','帳戶餘額、預算與月分析都會一併重算。',async()=>{await update(s=>s.transactions=s.transactions.filter(t=>t.id!==id));notify('已刪除紀錄');},'刪除紀錄');break;case 'archive-account':{const a=account(id);confirmAction(a.archived?'重新啟用帳戶？':'封存帳戶？','餘額與所有歷史交易會保留。封存後不再出現在新增交易的帳戶選單。',async()=>{await update(s=>{s.accounts.find(a=>a.id===id).archived=!a.archived;if(s.settings.defaultAccountId===id)s.settings.defaultAccountId='';});notify('已更新帳戶狀態');});break;}case 'delete-account':confirmAction('刪除未使用的帳戶？','只有沒有任何交易的帳戶可以刪除，期初餘額也會移除。',async()=>{await update(s=>{if(s.transactions.some(t=>t.accountId===id||t.toAccountId===id))throw new Error('帳戶已有交易，請改用封存。');s.accounts=s.accounts.filter(a=>a.id!==id);if(s.settings.defaultAccountId===id)s.settings.defaultAccountId='';});notify('已刪除帳戶');},'刪除帳戶');break;case 'persist':{const granted=await navigator.storage?.persist?.();const message=granted?'瀏覽器已允許持久保存。仍建議定期下載備份。':'這個瀏覽器尚未允許持久保存，請定期下載備份。';if($('persist-status'))$('persist-status').textContent=message;notify(message);break;}}}catch(err){if(dialog.open){$('dialog-error').textContent=err.message;$('dialog-error').hidden=false;}else error(err.message);}});
document.addEventListener('change',event=>{const t=event.target;if(t.id==='month'){if(M.validDate(t.value+'-01')&&t.value<=currentMonth){month=t.value;page=1;render();}else t.value=month;}if(t.id==='as-of'){if(M.validDate(t.value)&&t.value<=today){asOf=t.value;render();}else t.value=asOf;}if(t.id==='tx-kind'){updateTransactionFields(t.value);if(!txDraft.targetTouched)suggestTransferAmount();}if(t.id==='tx-account'){const currency=selectedTxAccount().currency;if(currency!==txDraft.sourceCurrency){selectLatestRate();txDraft.sourceCurrency=currency;txDraft.targetTouched=false;suggestTransferAmount();}updateTransactionPreview();if(currency!=='TWD')void refreshFx();}if(t.id==='tx-to'){const currency=account(t.value)?.currency||'';if(currency!==txDraft.targetCurrency){txDraft.targetCurrency=currency;txDraft.targetTouched=false;suggestTransferAmount();}updateTransactionPreview();if(currency&&currency!=='TWD')void refreshFx();}if(t.id==='tx-rate-date'){txDraft.rateTouched=true;txDraft.quote=null;updateTransactionPreview();}if(t.id==='account-type'&&t.value==='forex'&&$('account-currency').value==='TWD'){$('account-currency').value='USD';updateAccountPreview();void refreshFx();}if(t.id==='account-currency'){updateAccountPreview();if(t.value!=='TWD')void refreshFx();}if(['filter-kind','filter-account','filter-category','filter-all'].includes(t.id)){const key=t.id.slice(7);filter[key]=key==='all'?t.checked:t.value;page=1;$('records-region').innerHTML=recordsContent();}});
document.addEventListener('input',event=>{const t=event.target;if(t.id==='tx-amount'){if(!txDraft.targetTouched)suggestTransferAmount();updateTransactionPreview();}if(t.id==='tx-target-amount'){txDraft.targetTouched=true;updateTransactionPreview();}if(t.id==='tx-rate'){txDraft.rateTouched=true;txDraft.quote=null;updateTransactionPreview();}if(t.id==='account-opening')updateAccountPreview();if(event.target.id==='filter-query'){filter.query=event.target.value;page=1;$('records-region').innerHTML=recordsContent();}});
$('restore-file').addEventListener('change',async event=>{try{await restore(event.target.files[0]);}catch(err){error('無法還原：'+err.message);}finally{event.target.value='';}});
window.addEventListener('focus',()=>{void reload();if(ready)maybeRefreshFx();});
setInterval(()=>{if(syncClock()&&ready)render();if(ready&&document.visibilityState==='visible'&&Date.now()-lastAutoFx>=3600000)maybeRefreshFx();},60000);
(async()=>{try{db=await openDB();db.onversionchange=()=>{db.close();ready=false;error('帳本儲存格式已更新，請重新整理網頁。');};const raw=await readDB();state=raw?M.validateState(raw):M.emptyState();ready=true;$('storage-status').textContent='儲存在此裝置';try{channel=new BroadcastChannel('eric-money-ledger-updates');channel.onmessage=()=>{if(dialog.open)error('另一個分頁已更新帳本。請先取消目前表單再重開，避免覆蓋資料。');else reload();};}catch{}setView(location.hash.slice(1));maybeRefreshFx();if(state.transactions.length&&(!state.settings.lastBackupAt||Date.now()-Date.parse(state.settings.lastBackupAt)>7*86400000))notify('記得下載一份備份，把帳本留在自己手上');}catch(err){error('無法開啟本機帳本：'+err.message+'。原始資料不會被覆寫。');$('main').innerHTML=empty('帳本暫時無法開啟','請確認瀏覽器允許網站儲存資料，或使用原本的瀏覽器重新開啟。');$('storage-status').textContent='儲存不可用';}})();
})();
