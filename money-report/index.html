function notify(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4500);}
function error(message){$('global-error').textContent=message;$('global-error').hidden=false;}
function endOfMonth(m){const [y,n]=m.split('-').map(Number);return `${m}-${new Date(y,n,0).getDate()}`;}
function shiftMonth(m,delta){const [y,n]=m.split('-').map(Number);const d=new Date(y,n-1+delta,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function monthName(m){return `${m.slice(0,4)} 年 ${Number(m.slice(5))} 月`;}
function rawAmount(c){return (c/100).toFixed(2).replace(/\.00$/,'');}
function category(id){return [...M.categories.expense,...M.categories.income].find(x=>x.id===id);}
function account(id){return state.accounts.find(x=>x.id===id);}
function accountName(id){return account(id)?.name||'帳戶';}
function activeAccounts(extraId){return state.accounts.filter(a=>!a.archived||a.id===extraId);}
function option(value,label,selected){return `<option value="${e(value)}"${value===selected?' selected':''}>${e(label)}</option>`;}
function accountOptions(selected){return activeAccounts(selected).map(a=>option(a.id,a.name+(a.archived?'（已封存）':''),selected)).join('');}
function accountType(id){return M.accountTypes.find(x=>x.id===id);}
function isLiability(type){return !!accountType(type)?.liability;}
async function openDB(){return new Promise((resolve,reject)=>{const request=indexedDB.open('eric-money-ledger',1);request.onupgradeneeded=()=>request.result.createObjectStore('ledger');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);request.onblocked=()=>reject(new Error('請先關閉其他舊版記帳分頁，再重新整理。'));});}
async function readDB(){return new Promise((resolve,reject)=>{const tx=db.transaction('ledger','readonly');const q=tx.objectStore('ledger').get('main');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);});}
function syncClock(){const next=M.today();if(next===today)return false;const old=today,oldMonth=currentMonth;today=next;currentMonth=next.slice(0,7);if(asOf===old)asOf=next;if(month===oldMonth)month=currentMonth;document.querySelectorAll('input[type=date][max]').forEach(input=>input.max=today);return true;}
async function reload(){if(syncClock()&&ready)render();if(!db||!ready||busy||dialog.open)return;const expectedRevision=state.revision;try{const saved=await readDB();if(!ready||busy||dialog.open||state.revision!==expectedRevision)return;if(saved&&saved.revision!==expectedRevision){state=M.validateState(saved);render();notify('已載入另一個分頁的更新');}}catch(err){error('無法重新讀取帳本：'+err.message);}}
async function update(change){
 if(!ready||busy)throw new Error('帳本尚未就緒，請稍後再試。');
 const expectedRevision=state.revision;if(expectedRevision>=Number.MAX_SAFE_INTEGER)throw new Error('帳本版本已達上限，請先下載備份再聯絡維護者。');const draft=structuredClone(state);change(draft);draft.revision=expectedRevision+1;const clean=M.validateState(draft);busy=true;$('storage-status').textContent='儲存中…';
 try{await new Promise((resolve,reject)=>{const tx=db.transaction('ledger','readwrite');const store=tx.objectStore('ledger');let reason;const q=store.get('main');q.onsuccess=()=>{if((q.result?.revision||0)!==expectedRevision){reason=new Error('帳本已在另一個分頁更新。請取消並重開這份表單後再試，避免覆蓋資料。');tx.abort();return;}store.put(clean,'main');};tx.oncomplete=resolve;tx.onerror=()=>reject(reason||tx.error||new Error('資料無法儲存'));tx.onabort=()=>reject(reason||tx.error||new Error('儲存已中止'));});state=clean;channel?.postMessage({revision:state.revision});$('global-error').hidden=true;render();}finally{busy=false;$('storage-status').textContent='儲存在此裝置';}
}
function setView(v){view=views.some(x=>x.id===v)||v==='settings'?v:'overview';history.replaceState(null,'','#'+view);render();window.scrollTo({top:0,behavior:'instant'});}
function stat(label,value,caption='',accent=false){return `<section class="stat${accent?' accent':''}"><p class="label">${e(label)}</p><div class="value">${e(value)}</div><p class="caption">${e(caption)}</p></section>`;}
function empty(title,text,action,label){return `<div class="empty"><span class="empty-symbol">${icon('wallet')}</span><h2>${e(title)}</h2><p>${e(text)}</p>${action?`<button class="button primary" data-action="${e(action)}">${e(label)}</button>`:''}</div>`;}
function onboarding(){if(!state.accounts.length)return `<section class="onboarding"><div><p class="step">01 / 建立你的起點</p><h2>先加入一個常用帳戶</h2><p>填入目前存款或現金餘額，之後每筆收支都會自動更新。</p></div><button class="button primary" data-action="add-account">＋ 新增帳戶</button></section>`;if(!state.transactions.length)return `<section class="onboarding"><div><p class="step">02 / 從今天開始</p><h2>記下第一筆日常</h2><p>一筆午餐、一份薪水，或一筆轉帳。每月分析會隨著紀錄累積。</p></div><button class="button primary" data-action="add-transaction">＋ 記第一筆</button></section>`;return '';}
function distribution(r){
 const groups=r.groups.filter(g=>g.amount>0);if(!groups.length)return empty('這個月還沒有支出','記下第一筆消費後，就能看見錢花在哪裡。','add-transaction','記一筆');
 const circ=2*Math.PI*65;let offset=0;const rings=groups.map(g=>{const len=g.share*circ;const tag=`<circle cx="80" cy="80" r="65" fill="none" stroke="${e(g.color)}" stroke-width="15" stroke-linecap="butt" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-offset}"><title>${e(g.name)} ${e(money(g.amount))}，${(g.share*100).toFixed(1)}%</title></circle>`;offset+=len;return tag;}).join('');
 return `<div class="distribution"><div class="donut" role="img" aria-label="支出分佈，完整數值見右側分類"><svg viewBox="0 0 160 160">${rings}</svg><div class="donut-center">原始支出<strong class="money">${e(money(r.grossExpense))}</strong></div></div><div class="legend">${groups.map(g=>`<button class="legend-row" data-action="filter-category" data-id="${e(g.id)}"><i class="swatch" style="background:${e(g.color)}"></i><span class="legend-name">${e(g.name)}<small>${Math.round(g.share*100)}%</small></span><span class="legend-amount">${e(money(g.amount))}</span></button>`).join('')}</div></div><p class="note">${r.refunds?`本月退款 ${e(money(r.refunds))}；淨支出 ${e(money(r.expense))}。`:''}分佈以原始支出計算，退款與轉帳不列入占比。</p>`;
}
function budgetPanel(r){const total=r.budget.total||0;if(!total)return `<p class="muted">給這個月一個舒服的花費範圍。</p><div class="budget-number"><strong>尚未設定</strong></div><div class="progress-track"><span style="width:0"></span></div><p class="note">設定總預算或分類上限，記帳時就會同步追蹤。</p><button class="button small" data-action="budget" style="margin-top:16px">設定本月預算</button>`;const over=r.budget.remaining<0;return `<p class="muted">${over?'已超出預算':'本月還可以花'}</p><div class="budget-number"><strong class="money ${over?'expense':''}">${e(money(Math.abs(r.budget.remaining)))}</strong><span class="muted">${Math.round((r.budget.ratio||0)*100)}% 已使用</span></div><div class="progress-track ${over?'over':''}" role="progressbar" aria-label="本月預算使用" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(Math.max(0,Math.min(1,r.budget.ratio||0))*100)}"><span style="width:${Math.max(0,Math.min(100,(r.budget.ratio||0)*100))}%"></span></div><div class="budget-detail"><span>已用 ${e(money(r.expense))}</span><span>預算 ${e(money(total))}</span></div>${r.budget.dailyAllowance!==null?`<div class="insight-mini"><strong>把預算留給每一天</strong>依目前餘額與剩餘天數，平均每日可用 ${e(money(Math.max(0,r.budget.dailyAllowance)))}。</div>`:`<p class="note">預算依當月淨支出計算，退款會恢復可用額度。</p>`}`;}
function txRow(t,rank){const cat=category(t.categoryId);const title=t.note||cat?.name||typeNames[t.kind];const desc=t.kind==='transfer'?`${accountName(t.accountId)} → ${accountName(t.toAccountId)}`:`${cat?.name||typeNames[t.kind]} · ${accountName(t.accountId)}`;const sign=t.kind==='expense'?'−':t.kind==='income'||t.kind==='refund'?'+':t.kind==='adjustment'?(t.amount>0?'+':'−'):'';const color=t.kind==='expense'?'expense':t.kind==='income'||t.kind==='refund'?'income':'';return `<div class="transaction-row"><span class="transaction-icon">${rank?String(rank).padStart(2,'0'):icon(t.kind)}</span><div class="transaction-description"><strong>${e(title)}</strong><small>${e(t.date.slice(5).replace('-','/'))} · ${e(desc)}</small></div><span class="transaction-amount money ${color}">${sign}${e(money(Math.abs(t.amount)))}</span><button class="icon-button" data-action="edit-transaction" data-id="${e(t.id)}" aria-label="編輯 ${e(title)}">›</button></div>`;}
function overview(){const r=M.monthReport(state,month,today),tot=M.totals(state,today);const recent=state.transactions.filter(t=>t.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt)).slice(0,5);return `${onboarding()}<div class="stats">${stat('本月結餘',money(r.net),'收入減去淨支出',true)}${stat('本月收入',money(r.income),'不含轉帳與期初餘額')}${stat('本月支出',money(r.expense),r.refunds?'已扣除退款 '+money(r.refunds):'依已登錄消費')}${stat('今日淨資產',money(tot.net),'總資產減去負債')}</div><div class="grid-main"><section class="panel"><div class="section-head"><div><h2>消費分佈</h2><p class="muted">日常花費的樣子</p></div><button class="text-button" data-view="analysis">完整分析 ↗</button></div>${distribution(r)}</section><section class="panel"><div class="section-head"><h2>本月預算</h2><button class="text-button" data-action="budget">編輯</button></div>${budgetPanel(r)}</section></div><section class="panel"><div class="section-head"><h2>最近的紀錄</h2><button class="text-button" data-view="records">查看全部 ↗</button></div>${recent.length?`<div class="transaction-list">${recent.map(t=>txRow(t)).join('')}</div>`:empty('第一筆，就從今天開始','收入、支出與帳戶間轉帳，都能在這裡記下。','add-transaction','＋ 記一筆')}</section>`;}
function filtered(){return state.transactions.filter(t=>(filter.all||t.date.startsWith(month))&&(!filter.kind||t.kind===filter.kind)&&(!filter.account||t.accountId===filter.account||t.toAccountId===filter.account)&&(!filter.category||t.categoryId===filter.category)&&(!filter.query||[t.note,category(t.categoryId)?.name,accountName(t.accountId),t.toAccountId?accountName(t.toAccountId):'',typeNames[t.kind],t.date,rawAmount(t.amount)].join(' ').toLowerCase().includes(filter.query.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));}
function recordsContent(){const rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/40));page=Math.min(page,pages);const slice=rows.slice((page-1)*40,page*40);let last='';return `<div class="list-toolbar"><span class="list-summary">找到 ${rows.length.toLocaleString()} 筆紀錄${filter.all?' · 全部月份':''}</span><button class="text-button" data-action="export-filtered">匯出篩選結果 CSV ↗</button></div><section class="panel">${slice.length?slice.map(t=>{let out='';if(t.date!==last){last=t.date;out=`<p class="date-heading">${e(t.date.replaceAll('-',' / '))}</p>`;}return out+txRow(t);}).join(''):empty('沒有符合的紀錄','試著調整篩選條件，或新增一筆收支。','add-transaction','＋ 記一筆')}</section>${pages>1?`<div class="pagination"><button class="button small" data-action="page-prev" ${page===1?'disabled':''}>上一頁</button><span>${page} / ${pages}</span><button class="button small" data-action="page-next" ${page===pages?'disabled':''}>下一頁</button></div>`:''}`;}

function accounts(){const t=M.totals(state,asOf),rows=M.balances(state,asOf);return `<div class="as-of"><span class="muted">餘額截止日</span><input id="as-of" aria-label="餘額截止日" type="date" max="${today}" value="${asOf}" required><button class="button primary small" data-action="add-account">＋ 新增帳戶</button></div><div class="stats">${stat('淨資產',money(t.net),'資產 − 負債',true)}${stat('總資產',money(t.assets),'所有帳戶的正餘額')}${stat('總負債',money(t.liabilities),'所有帳戶的負餘額')}${stat('存款與現金',money(t.cash),'現金、銀行與儲蓄餘額')}</div>${rows.length?`<div class="accounts-grid">${rows.map(a=>`<article class="account-card${a.archived?' archived':''}"><div class="account-title"><div><h3>${e(a.name)}</h3><p class="account-type">${e(accountType(a.type)?.name||a.type)}${a.archived?' · 已封存':''}</p></div><span class="transaction-icon">${icon('wallet')}</span></div><p class="account-balance ${a.balance<0?'expense':''}">${e(money(Math.abs(a.balance)))}</p><p class="note">${a.openingDate>asOf?'此截止日尚未建立':a.balance<0?'待償還餘額':isLiability(a.type)&&a.balance>0?'預付／溢繳餘額':'帳戶餘額'} · ${e(asOf)}</p><div class="account-actions"><button class="text-button" data-action="edit-account" data-id="${e(a.id)}">編輯</button>${!a.archived?`<button class="text-button" data-action="adjust-account" data-id="${e(a.id)}">校正目前餘額</button>`:''}<button class="text-button" data-action="account-records" data-id="${e(a.id)}">交易明細 ↗</button></div></article>`).join('')}</div>`:`<section class="panel">${empty('把常用帳戶放在一起','先新增銀行存款、現金或信用卡，並填入期初餘額。','add-account','＋ 新增帳戶')}</section>`}<p class="note">餘額由你輸入的期初金額與後續交易計算，尚未連線銀行。投資帳戶顯示手動帳面餘額，並非即時市價。封存帳戶仍保留餘額與歷史。</p>`;}
function trendPanel(){const rows=M.trend(state,month,6),max=Math.max(1,...rows.flatMap(x=>[x.income,Math.max(0,x.expense)]));return `<div class="trend-chart" role="img" aria-label="最近六個月收入與淨支出，展開下方表格可查看完整金額">${rows.map(r=>`<div class="trend-column"><div class="trend-bars"><div class="trend-bar in" style="height:${r.income/max*100}%" title="${e(r.month)} 收入 ${e(money(r.income))}"></div><div class="trend-bar out" style="height:${Math.max(0,r.expense)/max*100}%" title="${e(r.month)} 淨支出 ${e(money(r.expense))}"></div></div><span class="trend-month">${r.month.slice(5)} 月</span></div>`).join('')}</div><div class="chart-key"><span><i style="background:#8daf9d"></i>收入</span><span><i style="background:#2a6153"></i>淨支出</span></div><details class="data-table"><summary>查看每月完整數字</summary><table><thead><tr><th>月份</th><th>收入</th><th>淨支出</th><th>結餘</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${e(r.month)}</td><td>${e(money(r.income))}</td><td>${e(money(r.expense))}</td><td>${e(money(r.net))}</td></tr>`).join('')}</tbody></table><p class="note">當月為目前累積值；退款高於支出時，負淨支出只列在表格。</p></details>`;}
function analysis(){const r=M.monthReport(state,month,today);const configured=state.budgets[month]?.categories||{};const limits=M.categories.expense.filter(c=>configured[c.id]>0);const biggest=state.transactions.filter(t=>t.date.startsWith(month)&&t.kind==='expense').sort((a,b)=>b.amount-a.amount).slice(0,5);return `<div class="stats">${stat('本月收入',money(r.income),'依已登錄收入')}${stat('本月淨支出',money(r.expense),'支出扣除退款')}${stat('本月結餘',money(r.net),'收入 − 淨支出',true)}${stat('收支結餘率',r.savingRate===null?'—':(r.savingRate*100).toFixed(1)+'%',r.savingRate===null?'沒有收入，暫不計算':'本月結餘 ÷ 收入')}</div>${r.count?`<div class="tips">${r.tips.map((t,i)=>`<article class="tip ${t.tone==='warning'||t.tone==='warn'?'warning':''}"><span class="tip-number">0${i+1}</span><h3>${e(t.title)}</h3><p>${e(t.detail)}</p></article>`).join('')}</div>`:`<section class="panel" style="margin-bottom:20px">${empty('先記錄，再看見變化','這個月還沒有收支資料，不會產生推測的分析或建議。','add-transaction','＋ 記一筆')}</section>`}<p class="note" style="margin:-2px 0 20px">分析依已登錄紀錄自動計算，不代表完整財務狀況。${r.comparison?.label?e(r.comparison.label):''}</p><div class="grid-equal"><section class="panel"><div class="section-head"><h2>消費分佈</h2><span class="muted">${r.count} 筆收支</span></div>${distribution(r)}</section><section class="panel"><div class="section-head"><h2>六個月收支趨勢</h2></div>${trendPanel()}</section></div><div class="grid-equal"><section class="panel"><div class="section-head"><h2>預算追蹤</h2><button class="text-button" data-action="budget">設定預算</button></div>${budgetPanel(r)}${limits.length?`<h3 class="subheading">分類上限</h3><div class="budget-list">${limits.map(c=>{const used=r.groups.find(g=>g.id===c.id)?.net||0,limit=configured[c.id];return `<div><div class="budget-number"><span>${e(c.name)}</span><strong>${e(money(used))} / ${e(money(limit))}</strong></div><div class="progress-track ${used>limit?'over':''}"><span style="width:${Math.max(0,Math.min(100,used/limit*100))}%"></span></div><p class="note" style="margin-top:5px">${used>limit?'超出 '+e(money(used-limit)):'剩餘 '+e(money(limit-used))}</p></div>`;}).join('')}</div>`:''}</section><section class="panel"><div class="section-head"><h2>本月較大的支出</h2><button class="text-button" data-view="records">看明細 ↗</button></div><div class="top-spends">${biggest.length?biggest.map((t,i)=>txRow(t,i+1)).join(''):empty('尚無支出紀錄','有消費紀錄後，這裡會列出金額最高的五筆。')}</div></section></div>`;}
function settings(){return `<div class="settings-grid"><section class="panel"><h2>備份與還原</h2><p>帳目只存在這個瀏覽器。換裝置前、清除瀏覽資料前，請先下載一份備份。</p><div class="facts"><div><span>帳戶</span><strong>${state.accounts.length} 個</strong></div><div><span>交易紀錄</span><strong>${state.transactions.length.toLocaleString()} 筆</strong></div><div><span>最近備份</span><strong>${state.settings.lastBackupAt?e(new Date(state.settings.lastBackupAt).toLocaleString('zh-TW')):'尚未備份'}</strong></div></div><div class="button-row"><button class="button primary" data-action="backup">下載完整備份</button><button class="button" data-action="restore">還原備份</button><button class="button" data-action="export-all">匯出明細 CSV</button></div><p class="note">完整備份包含帳戶、所有交易與預算。CSV 適合查閱，還原請使用 JSON 備份。</p></section><section class="panel"><h2>原本的月報，也留在這裡</h2><p>先前匯入的月報與分析繼續保留。月報是摘要資料，不會自動變成交易，也不會加入新帳本餘額。</p><div class="button-row"><a class="button" href="report-viewer.html">開啟月報檢視器 ↗</a></div><p class="note">月報檢視器支援原本的 money-report/1 月報檔與虛構示範資料。</p></section><section class="panel"><h2>資料保存</h2><p>這份帳本沒有銀行連線，也不會把帳目上傳到伺服器。不同瀏覽器、裝置之間不會自動同步。</p><div class="button-row"><button class="button" data-action="persist">申請瀏覽器持久保存</button></div><p class="note" id="persist-status">持久保存可降低瀏覽器自動清除的機會，仍需要定期備份。</p></section><section class="panel"><h2>記帳方式</h2><div class="facts"><div><span>日常消費</span><strong>記「支出」</strong></div><div><span>信用卡還款、帳戶互轉</span><strong>記「轉帳」</strong></div><div><span>退貨退款</span><strong>記「退款」</strong></div><div><span>對帳差異、投資估值</span><strong>「校正目前餘額」</strong></div></div><p class="note">信用卡與借款以欠款管理。餘額校正不算收入或支出，請保留原因。</p></section></div>`;}
function render(){if(!ready)return;syncClock();const v=views.find(x=>x.id===view);$('nav').innerHTML=views.map(x=>`<button class="nav-button" data-view="${x.id}"${x.id===view?' aria-current="page"':''}>${icon(x.icon)}${x.label}</button>`).join('');$('page-title').textContent=v?.title||'資料與設定';$('page-subtitle').textContent=v?.sub||'把帳本留在自己手上，也把資料照顧好。';$('page-eyebrow').textContent=view==='analysis'?monthName(month)+' · 月度回顧':'讓每一筆，都有著落';$('month-picker').hidden=view==='accounts'||view==='settings';$('month').value=month;$('month').max=currentMonth;document.querySelector('[data-action="previous-month"]').disabled=month<='1900-01';document.querySelector('[data-action="next-month"]').disabled=month>=currentMonth;$('quick-add').disabled=false;$('main').innerHTML=view==='overview'?overview():view==='records'?records():view==='accounts'?accounts():view==='analysis'?analysis():settings();}
function showDialog(title,body,handler,submitLabel='儲存'){if(dialog.open)dialog.close();$('dialog-title').textContent=title;$('dialog-body').innerHTML=body;$('dialog-error').hidden=true;$('save-button').textContent=submitLabel;dialogSubmit=handler;dialog.showModal();}
function confirmAction(title,description,handler,label='確認'){showDialog(title,`<p class="muted">${e(description)}</p>`,async()=>{await handler();},label);}
function field(label,content,wide=false,hint=''){return `<label class="field${wide?' wide':''}"><span>${label}</span>${content}${hint?`<small>${hint}</small>`:''}</label>`;}
function openTransaction(id){const t=state.transactions.find(x=>x.id===id);if(!t&&!activeAccounts().length){openAccount();notify('先建立第一個帳戶，就能開始記帳');return;}const kind=t?.kind||'expense',selected=t?.accountId||activeAccounts().find(a=>a.id===state.settings.defaultAccountId)?.id||activeAccounts()[0]?.id;const date=t?.date||(month===currentMonth?today:endOfMonth(month));showDialog(t?'編輯這筆紀錄':'記下這一筆',`<div class="form-grid">${field('類型',`<select name="kind" id="tx-kind">${(kind==='adjustment'?['adjustment']:['expense','income','transfer','refund']).map(k=>option(k,typeNames[k],kind)).join('')}</select>`)}${field('日期',`<input type="date" name="date" value="${e(date)}" max="${today}" required>`)}${field(kind==='adjustment'?'校正差額（可正負）':'金額 · NT$',`<input class="amount-input" name="amount" inputmode="decimal" type="text" placeholder="0" value="${t?e(rawAmount(t.amount)):''}" maxlength="20" autocomplete="off" required>`,true)}${field('帳戶',`<select name="accountId" required>${accountOptions(selected)}</select>`)}<label class="field" id="tx-category-field"><span>分類</span><select name="categoryId" id="tx-category"></select></label><label class="field wide" id="tx-to-field"><span>轉入帳戶</span><select name="toAccountId" id="tx-to"><option value="">選擇轉入帳戶</option>${accountOptions(t?.toAccountId)}</select></label>${field('備註',`<input name="note" maxlength="300" value="${e(t?.note||'')}" placeholder="例如：午餐、十月薪資" autocomplete="off">`,true)}</div><p class="note" id="tx-hint"></p>${t?`<div class="danger-zone"><button type="button" class="text-button expense" data-action="delete-transaction" data-id="${e(t.id)}">刪除這筆紀錄</button></div>`:''}`,async fd=>{const k=fd.get('kind');const value={id:t?.id||uid(),date:fd.get('date'),kind:k,amount:M.parseAmount(fd.get('amount'),{signed:k==='adjustment'}),accountId:fd.get('accountId'),toAccountId:k==='transfer'?fd.get('toAccountId'):'',categoryId:['expense','income','refund'].includes(k)?fd.get('categoryId'):'',note:fd.get('note').trim(),createdAt:t?.createdAt||new Date().toISOString()};M.validateTransaction(value,state);await update(s=>{const i=s.transactions.findIndex(x=>x.id===value.id);if(i>=0)s.transactions[i]=value;else s.transactions.push(value);if(!s.accounts.find(a=>a.id===value.accountId)?.archived)s.settings.defaultAccountId=value.accountId;});notify(t?'已更新這筆紀錄':'已記下一筆');});updateTransactionFields(kind,t?.categoryId);}
function updateTransactionFields(kind,selected){const categories=kind==='income'?M.categories.income:M.categories.expense;const hasCategory=['expense','income','refund'].includes(kind);$('tx-category-field').hidden=!hasCategory;$('tx-category').disabled=!hasCategory;$('tx-category').required=hasCategory;$('tx-category').innerHTML=categories.map(c=>option(c.id,c.name,selected)).join('');$('tx-to-field').hidden=kind!=='transfer';$('tx-to').disabled=kind!=='transfer';$('tx-to').required=kind==='transfer';$('tx-hint').textContent=kind==='transfer'?'帳戶互轉與信用卡還款請選「轉帳」，不會計入收入或消費。':kind==='refund'?'退款會加回收款帳戶，並沖減退款當月的分類支出。':kind==='adjustment'?'這是帳戶對帳差額，不會計入月收入或支出。':'交易日期須在帳戶期初日期之後，且不得晚於今天。';}
function openAccount(id){const a=state.accounts.find(x=>x.id===id),used=a&&state.transactions.some(t=>t.accountId===id||t.toAccountId===id);showDialog(a?'編輯帳戶':'新增常用帳戶',`<p class="form-hint">期初餘額請填「尚未包含之後要登錄交易」的金額。信用卡與借款填欠款金額。</p><div class="form-grid">${field('帳戶名稱',`<input name="name" maxlength="60" placeholder="例如：日常銀行、錢包" value="${e(a?.name||'')}" required>`,true)}${field('類型',`<select name="type" id="account-type" ${used?'disabled':''}>${M.accountTypes.map(t=>option(t.id,t.name,a?.type||'bank')).join('')}</select>`)}${field('期初日期',`<input name="openingDate" type="date" value="${a?.openingDate||today}" max="${today}" ${used?'disabled':''} required>`)}${field('期初餘額／欠款 · NT$',`<input name="openingBalance" inputmode="decimal" type="text" value="${a?e(rawAmount(isLiability(a.type)?-a.openingBalance:a.openingBalance)):'0'}" maxlength="20" ${used?'disabled':''} required>`,true,used?'已有交易，期初資料已鎖定。請使用「校正目前餘額」對帳。':'資產帳戶填存款；負債帳戶填欠款。負數代表透支或信用卡溢繳。')}</div>${a?`<div class="danger-zone"><button type="button" class="text-button" data-action="archive-account" data-id="${e(a.id)}">${a.archived?'重新啟用帳戶':'封存這個帳戶'}</button>${!used?`<button type="button" class="text-button expense" style="margin-left:20px" data-action="delete-account" data-id="${e(a.id)}">刪除未使用帳戶</button>`:''}</div>`:''}`,async fd=>{const type=used?a.type:fd.get('type'),amount=used?a.openingBalance:M.parseAmount(fd.get('openingBalance'),{signed:true})*(isLiability(type)?-1:1);const value={id:a?.id||uid(),name:fd.get('name').trim(),type,openingDate:used?a.openingDate:fd.get('openingDate'),openingBalance:amount,archived:a?.archived||false};await update(s=>{const i=s.accounts.findIndex(x=>x.id===value.id);if(i>=0)s.accounts[i]=value;else s.accounts.push(value);if(!s.settings.defaultAccountId)s.settings.defaultAccountId=value.id;});notify(a?'已更新帳戶':'帳戶已建立，可以開始記帳');});}
function adjustAccount(id){const a=account(id),balance=M.balances(state,today).find(x=>x.id===id)?.balance||0;const debt=isLiability(a.type);showDialog('校正目前餘額',`<p class="form-hint">${e(a.name)} · 目前${debt?'欠款':'餘額'} ${e(money(debt?-balance:balance))}。填入今天對帳後的實際金額，差額會留下一筆校正紀錄。</p><div class="form-grid">${field(debt?'實際欠款 · NT$':'實際餘額 · NT$',`<input class="amount-input" name="balance" inputmode="decimal" maxlength="20" value="${e(rawAmount(debt?-balance:balance))}" required>`,true)}${field('校正原因',`<input name="note" maxlength="300" placeholder="例如：核對銀行餘額、投資估值更新" required>`,true)}</div><p class="note">只改變資產餘額，不算收入或支出。${debt?'信用卡溢繳可輸入負數。':''}</p>`,async fd=>{const desired=M.parseAmount(fd.get('balance'),{signed:true})*(debt?-1:1),delta=desired-balance;if(!delta)throw new Error('餘額沒有變動，不需要校正。');await update(s=>s.transactions.push({id:uid(),date:today,kind:'adjustment',amount:delta,accountId:id,toAccountId:'',categoryId:'',note:fd.get('note').trim(),createdAt:new Date().toISOString()}));notify('已儲存餘額校正');});}
function budgetDialog(){const budgetMonth=month;const b=state.budgets[budgetMonth]||{total:0,categories:{}};showDialog(monthName(budgetMonth)+'預算',`<p class="form-hint">總預算與分類上限各自追蹤，不會相加。留白或 0 表示不設上限。</p>${field('本月總預算 · NT$',`<input class="amount-input" name="total" inputmode="decimal" maxlength="20" value="${b.total?e(rawAmount(b.total)):''}" placeholder="0">`)}<h3 class="subheading">分類預算（選填）</h3><div class="category-budgets">${M.categories.expense.map(c=>field(e(c.name),`<input name="budget:${e(c.id)}" inputmode="decimal" maxlength="20" placeholder="不設上限" value="${b.categories[c.id]?e(rawAmount(b.categories[c.id])):''}">`)).join('')}</div>`,async fd=>{const next={total:fd.get('total').trim()?M.parseAmount(fd.get('total')):0,categories:{}};for(const c of M.categories.expense){const text=fd.get('budget:'+c.id).trim();if(text)next.categories[c.id]=M.parseAmount(text);}await update(s=>s.budgets[budgetMonth]=next);notify('本月預算已儲存');});}
function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function backup(){if(!ready)return;const stamp=new Date().toISOString();download(`收支日常-完整備份-${today}-${Date.now()}.json`,JSON.stringify(state),'application/json');try{await update(s=>s.settings.lastBackupAt=stamp);notify('備份已下載，請妥善保存');}catch(err){notify('備份已下載；備份時間未能儲存：'+err.message);}}
function csv(rows){const cell=x=>{let v=String(x??'');if(/^[\s]*[=+\-@]/.test(v))v="'"+v;return '"'+v.replaceAll('"','""')+'"';};const out=[['日期','類型','金額（TWD）','帳戶','轉入帳戶','分類','備註'],...rows.map(t=>[t.date,typeNames[t.kind],rawAmount(t.amount),accountName(t.accountId),t.toAccountId?accountName(t.toAccountId):'',category(t.categoryId)?.name||'',t.note])];download(`收支日常-明細-${today}.csv`,'\uFEFF'+out.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');notify('CSV 已下載');}
async function restore(file){if(!file)return;if(file.size>25*1024*1024)throw new Error('備份檔超過 25 MB。');let parsed;try{parsed=JSON.parse(await file.text());}catch{throw new Error('這不是有效的 JSON 備份檔。');}const imported=M.validateState(parsed);showDialog('還原完整帳本',`<p class="form-hint">此操作會用備份取代目前的新帳本；原本的月報檢視器資料不受影響。</p><div class="restore-summary"><strong>備份：${imported.accounts.length} 個帳戶 / ${imported.transactions.length.toLocaleString()} 筆交易</strong><span>目前：${state.accounts.length} 個帳戶 / ${state.transactions.length.toLocaleString()} 筆交易</span><button type="button" class="text-button" data-action="backup">先下載目前帳本的備份 ↗</button></div><label class="checkbox-line"><input type="checkbox" name="confirmed" required>我已確認備份內容，並同意取代目前帳本。</label>`,async fd=>{if(fd.get('confirmed')!=='on')throw new Error('請先確認還原內容。');await update(s=>{s.accounts=imported.accounts;s.transactions=imported.transactions;s.budgets=imported.budgets;s.settings=imported.settings;});filter={query:'',kind:'',account:'',category:'',all:false};notify('帳本已還原');},'確認還原');}
form.addEventListener('submit',async event=>{event.preventDefault();if(busy||!dialogSubmit)return;$('dialog-error').hidden=true;$('save-button').disabled=true;try{await dialogSubmit(new FormData(form));dialog.close();}catch(err){$('dialog-error').textContent=err.message||'儲存失敗，請再試一次。';$('dialog-error').hidden=false;}finally{$('save-button').disabled=false;}});
dialog.addEventListener('cancel',event=>{if(busy)event.preventDefault();else setTimeout(reload,0);});
document.addEventListener('click',async event=>{const button=event.target.closest('[data-action],[data-view]');if(!button||button.disabled)return;if(button.dataset.view){setView(button.dataset.view);return;}const id=button.dataset.id;try{switch(button.dataset.action){case 'add-transaction':openTransaction();break;case 'edit-transaction':openTransaction(id);break;case 'add-account':openAccount();break;case 'edit-account':openAccount(id);break;case 'adjust-account':adjustAccount(id);break;case 'budget':budgetDialog();break;case 'close-dialog':if(!busy){dialog.close();await reload();}break;case 'previous-month':if(month>'1900-01'){month=shiftMonth(month,-1);page=1;render();}break;case 'next-month':if(month<currentMonth){month=shiftMonth(month,1);page=1;render();}break;case 'filter-category':filter.category=id;filter.kind='';filter.all=false;page=1;setView('records');break;case 'account-records':filter.account=id;filter.all=true;page=1;setView('records');break;case 'page-prev':page=Math.max(1,page-1);$('records-region').innerHTML=recordsContent();break;case 'page-next':page++;$('records-region').innerHTML=recordsContent();break;case 'backup':await backup();break;case 'restore':$('restore-file').click();break;case 'export-filtered':csv(filtered());break;case 'export-all':csv([...state.transactions].sort((a,b)=>a.date.localeCompare(b.date)));break;case 'delete-transaction':confirmAction('刪除這筆紀錄？','帳戶餘額、預算與月分析都會一併重算。',async()=>{await update(s=>s.transactions=s.transactions.filter(t=>t.id!==id));notify('已刪除紀錄');},'刪除紀錄');break;case 'archive-account':{const a=account(id);confirmAction(a.archived?'重新啟用帳戶？':'封存帳戶？','餘額與所有歷史交易會保留。封存後不再出現在新增交易的帳戶選單。',async()=>{await update(s=>{s.accounts.find(a=>a.id===id).archived=!a.archived;if(s.settings.defaultAccountId===id)s.settings.defaultAccountId='';});notify('已更新帳戶狀態');});break;}case 'delete-account':confirmAction('刪除未使用的帳戶？','只有沒有任何交易的帳戶可以刪除，期初餘額也會移除。',async()=>{await update(s=>{if(s.transactions.some(t=>t.accountId===id||t.toAccountId===id))throw new Error('帳戶已有交易，請改用封存。');s.accounts=s.accounts.filter(a=>a.id!==id);if(s.settings.defaultAccountId===id)s.settings.defaultAccountId='';});notify('已刪除帳戶');},'刪除帳戶');break;case 'persist':{const granted=await navigator.storage?.persist?.();const message=granted?'瀏覽器已允許持久保存。仍建議定期下載備份。':'這個瀏覽器尚未允許持久保存，請定期下載備份。';if($('persist-status'))$('persist-status').textContent=message;notify(message);break;}}}catch(err){if(dialog.open){$('dialog-error').textContent=err.message;$('dialog-error').hidden=false;}else error(err.message);}});
document.addEventListener('change',event=>{const t=event.target;if(t.id==='month'){if(M.validDate(t.value+'-01')&&t.value<=currentMonth){month=t.value;page=1;render();}else t.value=month;}if(t.id==='as-of'){if(M.validDate(t.value)&&t.value<=today){asOf=t.value;render();}else t.value=asOf;}if(t.id==='tx-kind')updateTransactionFields(t.value);if(['filter-kind','filter-account','filter-category','filter-all'].includes(t.id)){const key=t.id.slice(7);filter[key]=key==='all'?t.checked:t.value;page=1;$('records-region').innerHTML=recordsContent();}});
document.addEventListener('input',event=>{if(event.target.id==='filter-query'){filter.query=event.target.value;page=1;$('records-region').innerHTML=recordsContent();}});
$('restore-file').addEventListener('change',async event=>{try{await restore(event.target.files[0]);}catch(err){error('無法還原：'+err.message);}finally{event.target.value='';}});
window.addEventListener('focus',reload);
setInterval(()=>{if(syncClock()&&ready)render();},60000);
(async()=>{try{db=await openDB();db.onversionchange=()=>{db.close();ready=false;error('帳本儲存格式已更新，請重新整理網頁。');};const raw=await readDB();state=raw?M.validateState(raw):M.emptyState();ready=true;$('storage-status').textContent='儲存在此裝置';try{channel=new BroadcastChannel('eric-money-ledger-updates');channel.onmessage=()=>{if(dialog.open)error('另一個分頁已更新帳本。請先取消目前表單再重開，避免覆蓋資料。');else reload();};}catch{}setView(location.hash.slice(1));if(state.transactions.length&&(!state.settings.lastBackupAt||Date.now()-Date.parse(state.settings.lastBackupAt)>7*86400000))notify('記得下載一份備份，把帳本留在自己手上');}catch(err){error('無法開啟本機帳本：'+err.message+'。原始資料不會被覆寫。');$('main').innerHTML=empty('帳本暫時無法開啟','請確認瀏覽器允許網站儲存資料，或使用原本的瀏覽器重新開啟。');$('storage-status').textContent='儲存不可用';}})();
})();
